<style>
/* =========================================================
   Tokens: same palette as the admin console, plus a dark theme
   ========================================================= */
:root{
  --bg:#F3F5F5;--surface:#fff;--surface-2:#FAFBFB;--sunken:#F3F5F5;
  --ink:#16222B;--ink-2:#3A4A54;--muted:#56656D;--line:#E1E6E7;--line-2:#CDD6D7;
  --accent:#B8233A;--accent-2:#9A1D31;--accent-txt:#B8233A;--accent-soft:#FBEDEF;
  --ok:#2F6B4C;--ok-bar:#3E9A68;--ok-soft:#E5F1EA;--warn:#9A6212;--warn-bar:#D18A1F;--warn-soft:#FFF4E0;
  --blue:#2F5B94;--blue-soft:#E8EEF7;
  --solid:#16222B;--on-solid:#fff;--on-solid-2:#C9D3D6;--gem-on:#9CC0FF;--chip-s:rgba(255,255,255,.12);
  --ring:rgba(22,34,43,.08);--shade:rgba(22,34,43,.45);
  --side:#16222B;--side-2:#1F2E38;--side-txt:#A9B7BD;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;--side-w:252px;--nav-h:64px;--top-h:60px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0D151B;--surface:#141F27;--surface-2:#18242D;--sunken:#0F1920;
  --ink:#E6ECEF;--ink-2:#C0CBD1;--muted:#8C9BA4;--line:#22313B;--line-2:#30414C;
  --accent:#D63A52;--accent-2:#B8233A;--accent-txt:#FF8FA0;--accent-soft:rgba(214,58,82,.15);
  --ok:#6CCB97;--ok-soft:rgba(62,154,104,.16);--warn:#E8B25C;--warn-soft:rgba(209,138,31,.15);
  --blue:#8DB4EE;--blue-soft:rgba(47,91,148,.3);
  --solid:#E6ECEF;--on-solid:#101A21;--on-solid-2:#4A5A64;--gem-on:#2F5B94;--chip-s:rgba(0,0,0,.08);
  --ring:rgba(230,236,239,.12);--shade:rgba(0,0,0,.6);--side:#0A1116;--side-2:#141F27;--side-txt:#9AA9B1;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0D151B;--surface:#141F27;--surface-2:#18242D;--sunken:#0F1920;
  --ink:#E6ECEF;--ink-2:#C0CBD1;--muted:#8C9BA4;--line:#22313B;--line-2:#30414C;
  --accent:#D63A52;--accent-2:#B8233A;--accent-txt:#FF8FA0;--accent-soft:rgba(214,58,82,.15);
  --ok:#6CCB97;--ok-soft:rgba(62,154,104,.16);--warn:#E8B25C;--warn-soft:rgba(209,138,31,.15);
  --blue:#8DB4EE;--blue-soft:rgba(47,91,148,.3);
  --solid:#E6ECEF;--on-solid:#101A21;--on-solid-2:#4A5A64;--gem-on:#2F5B94;--chip-s:rgba(0,0,0,.08);
  --ring:rgba(230,236,239,.12);--shade:rgba(0,0,0,.6);--side:#0A1116;--side-2:#141F27;--side-txt:#9AA9B1;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--display);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));transition:background .2s,color .2s}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
svg{flex-shrink:0}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
.hint{font-size:.8rem;color:var(--muted)}
.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}

/* ---------- top bar ---------- */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:var(--top-h)}
.mono{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 18px -10px rgba(184,35,58,.9)}
.shop{flex:1;min-width:0}
.shop b{display:flex;align-items:center;gap:5px;font-weight:700;font-size:1rem}
.shop b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop small{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok-bar);flex-shrink:0;box-shadow:0 0 0 3px var(--ok-soft)}
.dot.off{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.crumb{display:none;flex:1;min-width:0;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s,background .15s}
.icon-btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.net{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:19;padding:8px 14px;text-align:center;font-size:.84rem;font-weight:600;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line)}
main{padding-top:16px}

/* ---------- hero (admin welcome card) ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:18px;padding:20px 20px 24px;margin-bottom:14px;background:linear-gradient(150deg,#16222B,#22333E);color:#fff;border:1px solid transparent;box-shadow:0 24px 50px -30px rgba(22,34,43,.7)}
:root[data-theme=dark] .hero{border-color:var(--line)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{border-color:var(--line)}}
.ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;z-index:-1}
.live{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#9FB0B7}
.live i{width:8px;height:8px;border-radius:50%;background:#5BC08A;box-shadow:0 0 0 4px rgba(91,192,138,.2);animation:pulse 2.2s infinite}
.live i.off{background:#F08A9A;box-shadow:0 0 0 4px rgba(240,138,154,.2);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(91,192,138,0)}}
.hero h1{font-size:1.65rem;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin-top:6px}
.hero .sub{color:#C9D3D6;font-size:.9rem;margin-top:6px;max-width:44ch}
.hstats{display:grid;gap:8px;margin-top:16px}
.hstats div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:grid;gap:2px;min-width:0}
.hstats span{font-size:.72rem;line-height:1.25;color:#9FB0B7}
.hstats b{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.tick{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.82rem;color:#DCE4E7;min-height:20px}
.tick em{font-style:normal}
.tick span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s,transform .25s}
.tick span.out{opacity:0;transform:translateY(6px)}

/* ---------- notes, buy-again, loyalty ---------- */
.note{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink)}
.note b{display:block}
.note.bad{background:var(--accent-soft);border-color:transparent;border-left-color:var(--accent);color:var(--accent-txt)}
.again{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:12px;animation:rise .3s ease-out}
.again .ai{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.again>div{flex:1;min-width:0}
.again b{display:block;font-size:.92rem}
.again small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loyal{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:12px;font-size:.86rem;font-weight:600}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{flex:1;height:6px;border-radius:99px;background:currentColor;opacity:.18}
.dots i.on{opacity:1;background:var(--warn-bar)}
.dots i.gift{opacity:.5;outline:1px dashed currentColor;outline-offset:1px;background:transparent}
.pbar{height:6px;border-radius:99px;background:rgba(154,98,18,.18);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--warn-bar);border-radius:99px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:54px}
.card-h h2{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:600}
.card-b{padding:16px}
.sn{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--sunken);border:1px solid var(--line-2);color:var(--muted);font-size:.78rem;font-weight:700;flex-shrink:0;transition:background .2s,border-color .2s,color .2s}
.sn.ok{background:var(--ok-bar);border-color:var(--ok-bar);color:#fff}
.link{color:var(--accent-txt);font-weight:600;font-size:.84rem;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.link:hover{text-decoration:underline}

/* ---------- fields ---------- */
.lab{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.lab em{font-style:normal;font-weight:500;color:var(--muted);font-size:.78rem}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:16px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
input.bad{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--accent-soft) !important;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{min-height:64px;resize:vertical}
.uidf{position:relative}
.uidf input{font-size:1.2rem;font-weight:700;letter-spacing:.05em;padding:13px 96px 13px 14px;font-variant-numeric:tabular-nums}
.uidf input::placeholder{letter-spacing:0;font-weight:500;font-size:1rem}
.uidf .paste{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:36px;padding:0 12px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);font-weight:600;font-size:.8rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.uidf .okb{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--ok-bar);color:#fff;display:flex;align-items:center;justify-content:center;animation:pop .25s}
@keyframes pop{from{transform:translateY(-50%) scale(.4)}}
#uidHint{margin-top:6px}
.uids{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.uids button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:600;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.uids button[aria-pressed=true]{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.howto{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunken);font-size:.84rem;color:var(--ink-2)}
.howto ol{padding-left:18px;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.check{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);margin-top:12px;cursor:pointer;width:max-content}
.check input{width:17px;height:17px;accent-color:var(--solid)}
.err{color:var(--accent-txt);font-weight:600;font-size:.86rem;margin-top:10px}
.err:empty{display:none}
.who{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--sunken);border:1px solid var(--line)}
.who .av{width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.who b{display:block;font-size:1.1rem;font-weight:800;letter-spacing:.03em}
.who small{display:block;color:var(--muted);font-size:.8rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ---------- segmented controls + chips ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--sunken);border:1px solid var(--line)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:6px 8px;border-radius:7px;color:var(--muted);font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.seg .pm{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;font-style:normal}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 16px;border-bottom:1px solid var(--line)}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex-shrink:0;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.84rem;color:var(--ink-2)}
.fchips button span{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.fchips button[aria-pressed=true]{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}

/* ---------- packages (admin picker: solid when picked) ---------- */
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pk{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:6px;row-gap:1px;text-align:left;padding:12px 11px 11px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);transition:border-color .15s,background .15s,color .15s,box-shadow .15s,transform .1s}
.pk:hover:not(:disabled){border-color:var(--ink-2)}
.pk:active:not(:disabled){transform:scale(.97)}
.pk:disabled{opacity:.5;cursor:not-allowed}
.pk .ic{display:flex;color:var(--blue)}
.pk b{font-size:1.06rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .u,.pk .pr,.pk .rt{grid-column:1/-1}
.pk .u{font-size:.72rem;color:var(--muted)}
.pk .pr{margin-top:5px;font-size:.92rem;font-weight:700;font-variant-numeric:tabular-nums}
.pk .rt{font-size:.66rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pk.on{background:var(--solid);border-color:var(--solid);color:var(--on-solid);box-shadow:0 8px 18px -10px var(--shade)}
.pk.on .u,.pk.on .rt{color:var(--on-solid-2)}
.pk.on .ic{color:var(--gem-on)}
.pk .tag{position:absolute;top:-8px;right:8px;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-bar);color:#fff;box-shadow:0 0 0 2px var(--surface);font-style:normal;white-space:nowrap}
.pk .tag.pop{background:var(--warn-bar)}
.pk .cnt{position:absolute;top:-7px;left:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface);font-style:normal;animation:bump .25s}
@keyframes bump{from{transform:scale(.4)}}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:.86rem;color:var(--muted)}
.tools .link{white-space:nowrap}
.calc{margin-top:10px;padding:12px;border-radius:12px;border:1px dashed var(--line-2);background:var(--surface-2);display:grid;gap:10px;animation:rise .2s ease-out}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0}
.cres{padding:12px;border-radius:10px;background:var(--solid);color:var(--on-solid);display:grid;gap:8px}
.cres .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cres .top span{font-size:.82rem;opacity:.75}
.cres .top b{font-size:1.25rem;font-weight:800;white-space:nowrap}
.cres .chips{display:flex;flex-wrap:wrap;gap:6px}
.cres .chips span{padding:3px 10px;border-radius:999px;background:var(--chip-s);font-weight:700;font-size:.82rem}
.cres small{opacity:.75;font-size:.78rem}
.cres .btn{justify-self:start}
.lines{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 10px 9px 14px;border-top:1px solid var(--line);animation:rise .2s ease-out}
.ln:first-child{border-top:none}
.ln b{font-weight:700;font-size:.92rem}
.ln small{display:block;font-size:.74rem;color:var(--muted)}
.qty{display:grid;grid-template-columns:34px 30px 34px;height:34px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{display:flex;align-items:center;justify-content:center;background:var(--sunken);font-size:1.05rem;font-weight:700;color:var(--ink-2)}
.qty button:hover{background:var(--line)}
.qty span{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.upsell{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:.84rem}

/* ---------- payment ---------- */
.payinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:11px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:.86rem;text-align:left}
.payinfo b{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.payinfo span{display:block;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.payinfo small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.payinfo.big{background:var(--warn-soft);border-color:transparent;margin:0 0 12px}
.payinfo.big span{font-size:1.05rem}
.addnote{margin-top:12px}
.addnote summary{list-style:none;cursor:pointer;width:max-content}
.addnote summary::-webkit-details-marker{display:none}
.addnote textarea{margin-top:8px}

/* ---------- trust + faq ---------- */
.trust3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.trust3 div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;font-size:.74rem;color:var(--muted)}
.trust3 b{display:block;font-size:1.1rem;margin-bottom:2px}
.trust3 strong{display:block;color:var(--ink);font-size:.8rem}
.faq details{border-top:1px solid var(--line)}
.faq details:first-of-type{border-top:none}
.faq summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex-shrink:0;transition:transform .2s}
.faq details[open] summary{color:var(--accent-txt)}
.faq details[open] summary::after{transform:rotate(-135deg)}
.faq details p{padding:0 16px 14px;color:var(--ink-2);font-size:.9rem;line-height:1.6}
.links{margin-bottom:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:.95rem;color:var(--ink);text-decoration:none;text-align:center;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .08s,box-shadow .15s}
.btn:hover{border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.82rem;border-radius:9px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(184,35,58,.9)}
.btn.accent:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.solid{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface);border-color:var(--line)}
.btn.block{width:100%;white-space:normal;padding-top:8px;padding-bottom:8px;line-height:1.25}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:grid;gap:10px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite;display:inline-block}
.spin.dk{width:24px;height:24px;border-color:var(--line);border-top-color:var(--ink)}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- order summary (desktop) + checkout bar (phone) ---------- */
.osum{display:none}
.sum{background:var(--sunken);border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:.9rem}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum .t{border-top:1px solid var(--line-2);margin-top:6px;padding-top:9px;font-size:1rem}
.sempty{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;background:var(--sunken);color:var(--muted);font-size:.88rem;margin-bottom:12px}
.chk{list-style:none;display:grid;gap:8px;margin-bottom:14px;font-size:.88rem;color:var(--muted)}
.chk li{display:flex;align-items:center;gap:10px}
.chk i{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.72rem;font-weight:700;background:var(--sunken);border:1px solid var(--line-2)}
.chk li.ok{color:var(--ink)}
.chk li.ok i{background:var(--ok-bar);border-color:var(--ok-bar);color:#fff}
.cbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 24px -18px var(--shade)}
.cbar .prog{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;height:3px}
.cbar .prog i{background:var(--line);transition:background .3s}
.cbar .prog i.on{background:var(--ok-bar)}
.cbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:9px 14px 10px}
.cbar .tot{flex:1;min-width:0}
.cbar small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar b{display:block;font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.cbar.empty b{font-size:.98rem;color:var(--muted);font-weight:600}
.cbar .btn{min-width:140px}

/* ---------- bottom nav (phone) / sidebar (desktop) ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;height:var(--nav-h);padding:6px}
.bnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;color:var(--muted);font-size:.7rem;font-weight:600;text-decoration:none;transition:background .15s,color .15s}
.bnav a svg{width:20px;height:20px}
.bnav a.on{color:var(--ink);background:var(--sunken)}
.bnav a.on svg{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:.64rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-style:normal}
.sb-brand,.sb-foot{display:none}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:30;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px -20px var(--shade);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:600px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:18px;padding-top:18px;animation:fade .2s}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:4px auto 12px}
.sheet h3{font-size:1.1rem;font-weight:700;margin-bottom:12px}
.sheet p.q{color:var(--muted);margin:-4px 0 16px;font-size:.92rem}
.uidbox{text-align:center;padding:14px;border-radius:12px;border:1.5px dashed var(--line-2);background:var(--surface-2);margin-bottom:12px}
.uidbox span{display:block;font-size:.76rem;color:var(--muted);font-weight:600}
.uidbox b{display:block;font-size:1.8rem;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.uidbox small{color:var(--muted);font-size:.76rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;font-weight:600;overflow-wrap:anywhere}

/* ---------- done / track ---------- */
.done{text-align:center}
.done .okc{width:72px;height:72px;margin:4px auto 8px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;animation:popin .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.done h2{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.done>p{color:var(--muted);margin:4px 0 12px;font-size:.92rem}
.code{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-weight:800;letter-spacing:.06em;margin-bottom:12px;font-size:.88rem;color:var(--ink)}
.paidf{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;margin-bottom:12px}
.paidf label{grid-column:1/-1;font-size:.84rem;font-weight:600}
.paidok{padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:.88rem;margin-bottom:12px;text-align:left}
.eta{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--ink);margin-bottom:14px}
.eta svg{color:var(--blue)}
.eta b{display:block;font-size:.92rem}
.eta small{color:var(--muted);font-size:.8rem}
.eta.ok{background:var(--ok-soft)} .eta.ok svg{color:var(--ok)}
.tl{list-style:none;margin:0 0 14px}
.tl li{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:15px;top:30px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl .d{width:32px;height:32px;border-radius:50%;background:var(--sunken);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:var(--muted);position:relative;z-index:1}
.tl li.ok .d{background:var(--ok-bar);border-color:var(--ok-bar);color:#fff}
.tl li.ok::before{background:var(--ok-bar)}
.tl li.now .d{background:var(--surface);border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--ring)}
.tl li.bad .d{background:var(--accent);border-color:var(--accent);color:#fff}
.tl b{display:block;padding-top:5px}
.tl small{color:var(--muted);font-size:.8rem}
.reason{padding:12px 14px;border-radius:10px;background:var(--accent-soft);margin-bottom:12px}
.reason b{display:block;color:var(--accent-txt)}
.reason small{color:var(--ink-2)}
.copyv{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font-weight:600;color:inherit;padding:0}
.copyv svg{color:var(--muted)}

/* ---------- orders list ---------- */
.oc{display:grid;gap:8px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.fchips+.oc,.card-h+.oc{border-top:none}
.oc:hover{background:var(--surface-2)}
.oc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc .top b{font-weight:700;display:flex;align-items:center;gap:8px}
.oc .it{font-size:.9rem;color:var(--ink-2)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.mini i{height:4px;border-radius:99px;background:var(--line)}
.mini i.on{background:var(--ok-bar)}
.oc .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.oc .bot b{color:var(--ink);font-size:.95rem}
.sb{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:999px}
.sb.new{background:var(--warn-soft);color:var(--warn)}
.sb.done{background:var(--blue-soft);color:var(--blue)}
.sb.dlv{background:var(--ok-soft);color:var(--ok)}
.sb.rej,.sb.can{background:var(--accent-soft);color:var(--accent-txt)}

/* ---------- account ---------- */
.idcard{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:14px;background:linear-gradient(150deg,#16222B,#22333E);color:#fff;margin-bottom:12px}
.idcard span{display:block;font-size:.74rem;color:#9FB0B7}
.idcard b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:.06em}
.idcard small{color:#C9D3D6;font-size:.78rem;overflow-wrap:anywhere}
.idcard .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--sunken);border-radius:10px;padding:10px;display:grid;gap:2px;min-width:0}
.stats span{font-size:.7rem;color:var(--muted)}
.stats b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.gbox{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px dashed var(--line-2);margin-top:12px}
.gbox b{display:block;font-size:.92rem}
.gbox small{color:var(--muted);font-size:.78rem}
.gbox .g{width:20px;height:20px;border-radius:50%;background:#fff;color:#4285F4;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.field{margin-bottom:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:none;padding-top:0}
.setrow:last-child{padding-bottom:0}
.setrow b{display:block;font-size:.92rem;font-weight:600}
.setrow small{display:block;color:var(--muted);font-size:.78rem}
.setrow .seg{min-width:210px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked=true]{background:var(--ok-bar)}
.switch[aria-checked=true]::after{left:21px}
.uids .x{display:inline-flex;align-items:center;gap:6px}
.uids .x i{font-style:normal;opacity:.55;font-weight:800}

/* ---------- misc ---------- */
.state{padding:36px 16px;text-align:center;color:var(--muted)}
.state b{color:var(--ink);display:block;font-size:1rem;margin-bottom:4px}
.state .emo{font-size:2.4rem;margin-bottom:6px}
.state p{margin-top:14px}
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
.skel.hero-s{height:190px;border-radius:18px}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--solid);color:var(--on-solid);padding:11px 16px;border-radius:10px;font-weight:600;font-size:.88rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:min(92vw,440px);text-align:center;box-shadow:0 14px 30px -12px var(--shade)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok-bar);color:#fff}
.toast.bad{background:var(--accent);color:#fff}
.foot{text-align:center;color:var(--muted);font-size:.76rem;padding:6px 16px 150px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;bottom:-30px;font-size:22px;font-style:normal;animation:fly var(--d) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--x),-88vh) rotate(var(--r));opacity:0}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}

/* ---------- desktop: sidebar like the admin console ---------- */
@media(min-width:900px){
  body{padding-bottom:0;padding-left:var(--side-w)}
  .appbar .wrap{max-width:none;padding:0 28px;height:62px}
  .appbar .mono,.appbar .shop{display:none}
  .crumb{display:block}
  main.wrap{max-width:780px;padding:26px 28px 0}
  .foot{max-width:780px;margin:0 auto;padding-bottom:120px}
  .net{top:62px}
  .pkgs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero{padding:26px 26px 30px}
  .hero h1{font-size:1.9rem}
  .bnav{top:0;bottom:0;left:0;right:auto;width:var(--side-w);border-top:none;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
  .bnav .in{display:flex;flex-direction:column;height:auto;max-width:none;margin:0;padding:0;gap:2px}
  .bnav a{flex-direction:row;justify-content:flex-start;gap:11px;padding:10px;border-radius:9px;color:var(--side-txt);font-size:.95rem;font-weight:500}
  .bnav a svg{width:18px;height:18px}
  .bnav a:hover{background:var(--side-2);color:#fff}
  .bnav a.on{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .bnav a.on svg{color:#fff}
  .bnav .badge{position:static;margin-left:auto;height:20px;min-width:22px;font-size:.72rem}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;color:#fff;font-weight:600}
  .sb-brand b{display:block;font-size:.98rem;line-height:1.25}
  .sb-brand small{display:block;font-weight:400;font-size:.76rem;color:var(--side-txt)}
  .sb-foot{display:grid;gap:4px;margin:auto 6px 0;padding:12px;border-radius:10px;background:var(--side-2)}
  .sb-foot .t{display:flex;justify-content:space-between;align-items:center;font-size:.78rem}
  .sb-foot .t i{width:7px;height:7px;border-radius:50%;background:#5BC08A;box-shadow:0 0 0 3px rgba(91,192,138,.2)}
  .sb-foot .t i.off{background:#F08A9A;box-shadow:0 0 0 3px rgba(240,138,154,.2)}
  .sb-foot b{color:#fff;font-size:1.35rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sb-foot small{font-size:.74rem}
  .sb-foot .btn{margin-top:8px;min-height:38px;font-size:.84rem;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
  .cbar{left:var(--side-w)}
  .cbar .in{max-width:780px;padding:10px 28px 12px}
  .toast{left:calc(50% + var(--side-w)/2);bottom:96px}
}
/* wide screens: order summary sticks on the right, no bottom bar */
@media(min-width:1200px){
  body.v-shop main.wrap,body.v-shop .foot{max-width:1120px}
  .shop-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .osum{display:block;position:sticky;top:80px}
  body.v-shop .cbar{display:none}
  body.v-shop .foot{padding-bottom:40px}
}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.setrow{flex-wrap:wrap}.setrow>div:first-child{flex:1;min-width:60%}.setrow .seg{min-width:0;width:100%}}
@media(max-width:380px){.hstats{grid-template-columns:1fr 1fr !important}.hstats div:last-child:nth-child(3){grid-column:1/-1}}
@media(max-width:350px){.pkgs{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* ---------- QR codes + screenshot ---------- */
.payinfo{display:block}
.payinfo .prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pacts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qrthumb{position:relative;width:46px;height:46px;border-radius:9px;border:1px solid var(--line-2);background:#fff;padding:3px;overflow:hidden}
.qrthumb img{width:100%;height:100%;object-fit:contain;display:block}
.qrthumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(22,34,43,.82);color:#fff;font-size:.56rem;font-weight:800;letter-spacing:.06em;text-align:center;line-height:1.5}
.qrbig{display:grid;justify-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(154,98,18,.3);text-align:center}
.qrimg{width:min(240px,70vw);aspect-ratio:1;border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line);box-shadow:0 10px 24px -16px var(--shade);cursor:zoom-in}
.qrimg img,.qrsheet img{width:100%;height:100%;object-fit:contain;display:block}
.qrbig p{font-size:.86rem;color:var(--ink-2)}
.qrsheet{width:min(320px,82vw);aspect-ratio:1;margin:0 auto;border-radius:14px;background:#fff;padding:10px;border:1px solid var(--line)}
.seg button{min-width:0}
#method button{padding:6px 4px;gap:5px;font-size:.84rem}
#method .pm{width:18px;height:18px}
.payinfo .qrbig p b,.payinfo .qfill b{display:inline;font-size:inherit;font-weight:800}
.payinfo .qrbig p b{color:var(--ink)}
.qfill{margin-top:8px;font-size:.8rem;color:var(--ok);font-weight:600}

function shrinkImg(file, max, q){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error('Not an image')); im.onload=()=>{

  const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',q)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

  let det='';
  if (m==='Bank'&&(b.no||s.bank)){
    det=`<div class="pc pc-d"><h3>🏛 Bank transfer</h3>${b.no?`<div class="kvl">${b.name?`<p><b>Bank:</b> ${esc(b.name)}</p>`:''}${b.holder?`<p><b>Account name:</b> ${esc(b.holder)}</p>`:''}<p><b>A/C no:</b> <span class="num">${esc(b.no)}</span> <button class="btn sm" type="button" data-copy="${esc(b.no)}">${IC.copy}Copy</button></p>${b.branch?`<p><b>Branch:</b> ${esc(b.branch)}</p>`:''}</div>`:`<p>${esc(s.bank)}</p>`}
      <p class="pc-note"><i>*</i> Please take a screenshot after the payment.</p></div>`;
  } else if (m==='eSewa'||m==='Khalti'){
    const v=m==='eSewa'?s.esewa:s.khalti, num=(String(v||'').match(/9[78]\d{8}/)||[])[0];
    if (v) det=`<div class="pc pc-d"><h3>📱 ${esc(m)} ID</h3><div class="kvl"><p><b>${esc(m)} ID:</b> ${esc(v)} ${num?`<button class="btn sm" type="button" data-copy="${num}">${IC.copy}Copy</button>`:''}</p><p><b>Amount:</b> ${rs(amt)}</p></div><p class="pc-note"><i>*</i> Please take a screenshot after the payment.</p></div>`;
  }
  return qr+det || `<div class="pc pc-d"><p>${esc(s.pay||'Ask the shop for payment details on WhatsApp.')}</p></div>`;
}
function coShotHTML(){
  if (co.method==='Cash') return '';
  return `<label class="lab" for="coShot">Upload payment screenshot <em class="req">*</em></label>
    <label class="drop${shotFile?' has':''}" id="coDrop"><input type="file" accept="image/*" id="coShot" hidden/>
      ${shotFile?`<img src="${shotFile}" alt=""/><span><b>Screenshot added</b><small>Tap to change</small></span>`
        :`<span class="up">${sv('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16.5A4.5 4.5 0 0 0 17.5 8h-.3A7 7 0 1 0 4 15"/>',30,1.8)}</span><b>Tap to upload your screenshot</b><small>PNG or JPG from your gallery</small>`}</label>
    <input type="text" id="coRef" maxlength="40" placeholder="Transaction ID (optional)" value="${esc(co.ref)}" autocomplete="off" style="margin-top:10px"/>`;
}
function coBtnText(){ return co.method==='Cash'?`Place order · ${rs(total())}`:`Confirm payment & order`; }
function viewCheckout(){
  const ls=lines(), s=P.stats||{}, pm=coMethods(), saved=store.get('dc-method',null);
  if (!pm.includes(co.method)) co.method=pm.includes(saved)?saved:((PAY.qr||{}).all&&pm.includes('Bank')?'Bank':pm[0]);   // QR first: it works with every app
  return `<a class="back" href="./" data-nav="shop">${sv('<path d="m15 18-6-6 6-6"/>',16)}Edit order</a>
  <section class="card co">
    <div class="co-sec">
      <h2 class="co-t"><span class="i">🛒</span>Checkout summary</h2>
      <dl class="co-rows">${ls.map(l=>{ const p=pk(l.id); return `<dt>${l.qty} × ${esc(label(p))}</dt><dd class="num">${rs(p.price*l.qty)}</dd>`; }).join('')}
        <dt>Diamonds</dt><dd class="num">${nf(cartDia())}</dd>
        <dt>Delivery</dt><dd>Within 24 hours after verification</dd></dl>
      <div class="co-price"><div class="tot"><span>Total payable</span><b class="num">${rs(total())}</b></div></div>
    </div>
    <div class="co-sec">
      <h2 class="co-t"><span class="i">🎮</span>Player details<a class="link co-edit" href="./" data-nav="shop">Change</a></h2>
      <div class="co-det"><div class="full"><span>Free Fire UID</span><b class="num co-uid">${esc(me.uid)}</b><small>Diamonds go to this UID. Please double-check it.</small></div><div><span>Name</span><b>${esc(me.name)}</b></div><div><span>WhatsApp</span><b>${esc(me.phone||'–')}</b></div></div>
    </div>
    ${!signedIn()?`<div class="co-sec">${signInBox('Sign in to place your order','Your orders are saved to your account, not to this phone. You can see them on any phone, any time.')}</div>`:`<div class="co-sec">
      <p class="co-acct">✓ Orders saved to <b>${esc(CU.email||'your Google account')}</b></p>
      <h2 class="co-t"><span class="i">💳</span>How do you want to pay?</h2>
      <div class="co-chips" role="radiogroup">${pm.map(m=>`<button type="button" role="radio" data-com="${m}" aria-checked="${m===co.method}"><i class="pm" style="background:${PAYC[m][0]}">${PAYC[m][1]}</i>${esc(coLabel(m))}</button>`).join('')}</div>
      <div id="coPay">${coPayHTML()}</div>
      <div id="coShotBox" class="co-shot">${coShotHTML()}</div>
      <details class="addnote" ${me.note?'open':''}><summary class="link">+ Add a note for the shop</summary><textarea id="coNote" maxlength="200" placeholder="Anything we should know">${esc(me.note||'')}</textarea></details>
      <label class="agree"><input type="checkbox" id="coAgree"/><span>I agree to the <button type="button" class="link" id="termsBtn">Terms and Conditions</button></span></label>
      <p class="err" id="coErr" role="alert"></p>
      <button class="btn accent block xl" type="button" id="coPlace">${coBtnText()}</button>
      <p class="co-trust">🔒 Secure payment · ✅ Verified within 24 hours · 📍 Live tracking</p>
      <p class="co-foot">By placing this order you agree to our terms. Verification may take up to 24 hours. Diamonds are loaded to your UID after verification, and you can follow every step in My orders.</p>
    </div>`}
  </section>`;
}
function renderCheckout(){
  if (!P) return; if (!lines().length||!uidValid(me.uid)||!me.name){ history.replaceState(null,'',location.pathname); route(); return; }
  const agreed=$('coAgree')&&$('coAgree').checked; $('app').innerHTML=viewCheckout(); if (agreed) $('coAgree').checked=true; paintCbar(); badges();
}
function coRefresh(){ const p=$('coPay'); if (p) p.innerHTML=coPayHTML(); const s=$('coShotBox'); if (s) s.innerHTML=coShotHTML(); const b=$('coPlace'); if (b&&!b.disabled) b.textContent=coBtnText(); }
function openTerms(){
  openSheet(`<div class="grab"></div><h3>Terms and Conditions</h3><ol class="terms">${TERMS.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ol>
    <div class="btns" style="margin-top:14px"><button class="btn accent block" type="button" id="termsOk">I agree</button></div>`);
  $('termsOk').onclick=()=>{ closeSheet(); const a=$('coAgree'); if (a) a.checked=true; };
}
async function placeCheckout(){
  const errEl=$('coErr'), err=x=>{ errEl.textContent=x; buzz(30); errEl.scrollIntoView({block:'center',behavior:smooth()}); };
  errEl.textContent='';
  if (!isOpen()) return err('Orders are paused right now. Please try again later.');
  if (!lines().length||!uidValid(me.uid)||!me.name){ nav('shop'); return; }
  if (!signedIn()) return err('Sign in with Google first, so your order is saved to your account.');
  const cash=co.method==='Cash';
  if (!co.method) return err('Choose how you want to pay.');
  if (!cash&&!shotFile){ err('Upload your payment screenshot first.'); const d=$('coDrop'); if (d){ d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad'); } return; }
  if (!$('coAgree').checked) return err('Please agree to the Terms and Conditions.');
  if (!navigator.onLine) return err('You’re offline. Connect to the internet and try again.');
  if (Date.now()-(+store.get('dc-last-order',0))<60000) return err('You just placed an order. Please wait a minute.');
  if (!CU) return err('Couldn’t start your account. '+(AUTH_ERR||'Reload the page and try again.'));
  const items=lines().map(l=>{ const p=pk(l.id); return {pkId:p.id,name:p.name,diamonds:p.diamonds,kind:p.kind,qty:l.qty,price:p.price}; });
  const b=$('coPlace'); b.disabled=true; b.innerHTML='<span class="spin"></span>Sending your order…';
  method=co.method; store.set('dc-method',method);
  let ref;
  const data={name:me.name, phone:me.phone, uid:me.uid, items, method:co.method, note:me.note||'', at:Date.now(), status:'new', total:total(), cid:CU.uid, ccode:CP?CP.code:''};
  try{ ref=await addDoc(collection(db,'orders'), data); }
  catch(e){ console.error(e); b.disabled=false; b.textContent=coBtnText(); return err('Couldn’t send the order. Check your internet and try again.'); }
  let shot=false;
  if (!cash){
    try{ await setDoc(doc(db,'payshots',ref.id),{img:shotFile, at:Date.now()}); shot=true; }catch(e){ console.warn('screenshot',e); }
    const pd={paidAt:Date.now(), paidRef:(co.ref||'').slice(0,40)}; if (shot) pd.paidShot=true;
    try{ await setDoc(doc(db,'orders',ref.id),pd,{merge:true}); }catch(e){ if (shot){ delete pd.paidShot; try{ await setDoc(doc(db,'orders',ref.id),pd,{merge:true}); }catch(_){} } }
    Object.assign(data,pd);
  }
  store.set('dc-last-order', Date.now()); rememberUid(me.uid);
  last={id:ref.id, ...data}; if (!MY.some(o=>o.id===ref.id)) MY.unshift(last); prevSt.set(ref.id,'new');
  if (!cash&&!shot) toast('Order placed, but the screenshot didn’t upload. Please send it on WhatsApp.','bad');
  me.note=''; cart=[]; calcRes=null; calcOpen=false; shotFile=null; co.ref=''; step=4; buzz(25);
  history.replaceState(null,'',location.pathname); route(); scrollTo({top:0,behavior:smooth()});
  if (CP) saveProfile({name:me.name, phone:me.phone, ffUids:[me.uid, ...(CP.ffUids||[]).filter(u=>u!==me.uid)].slice(0,5)});
}
document.addEventListener('click', e=>{
  const ch=e.target.closest('[data-com]'); if (ch){ co.method=ch.dataset.com; document.querySelectorAll('[data-com]').forEach(x=>x.setAttribute('aria-checked',String(x===ch))); coRefresh(); buzz(); return; }
  if (e.target.closest('#termsBtn')){ e.preventDefault(); openTerms(); return; }
  if (e.target.closest('#coPlace')){ placeCheckout(); return; }
});
document.addEventListener('change', e=>{ if (e.target.id==='coAgree'&&e.target.checked&&$('coErr')) $('coErr').textContent=''; });
document.addEventListener('input', e=>{ if (e.target.id==='coRef') co.ref=e.target.value.trim(); else if (e.target.id==='coNote') me.note=e.target.value.trim(); });

const crumbs={shop:'Shop',orders:'My orders',account:'Account',track:'Order status',checkout:'Checkout'};
function swapView(fn){ if (routed&&document.startViewTransition&&!reduced.matches){ try{ document.startViewTransition(fn); }catch(_){ fn(); } } else fn(); routed=true; }
function route(){
  const id=new URLSearchParams(location.search).get('o'), h=location.hash;
  const nv = id?'track': h==='#orders'?'orders': h==='#account'?'account': h==='#checkout'?'checkout':'shop';
  if (nv!=='track'&&unTrack){ unTrack(); unTrack=null; }
  view=nv; ['shop','orders','account','track','checkout'].forEach(v=>document.body.classList.toggle('v-'+v, v===view));
  document.querySelectorAll('.bnav [data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===(view==='track'?'orders':view==='checkout'?'shop':view)));
  $('crumb').textContent=crumbs[view];
  if (view!=='track') document.title=(P&&P.shop.name?P.shop.name+' · ':'')+'Free Fire Diamonds';
  if (!P&&view!=='track') return;
  swapView(()=>{ if (view==='track') viewTrack(id); else if (view==='orders') renderOrders(); else if (view==='account') viewAccount(); else if (view==='checkout') renderCheckout(); else renderShop(); });
  paintCbar();
}
function nav(v){ if (view==='shop'&&step!==4) readForm(); history.pushState(null,'',location.pathname+(v==='orders'?'#orders':v==='account'?'#account':v==='checkout'?'#checkout':'')); route(); scrollTo({top:0}); }
function navTrack(id){ if (view==='shop'&&step!==4) readForm(); history.pushState(null,'',location.pathname+'?o='+encodeURIComponent(id)); route(); scrollTo({top:0}); }
document.addEventListener('click', e=>{ const a=e.target.closest('[data-nav]'); if (!a||e.metaKey||e.ctrlKey) return; e.preventDefault(); if (a.dataset.nav==='shop'&&view==='shop'&&step===4){ step=1; last=null; } nav(a.dataset.nav); });
addEventListener('popstate', route);
addEventListener('hashchange', ()=>{ route(); scrollTo({top:0}); });

/* =========================================================
   START
   ========================================================= */
async function startAuth(){
  AUTH_ERR=null; if (view==='account') viewAccount();
  clearTimeout(authTimer); authTimer=setTimeout(()=>{ if(!CU){ AUTH_ERR='timeout: sign-in did not respond'; myLoaded=true; if(view==='account'||view==='orders') route(); } },12000);
  if (auth.currentUser){ CU=auth.currentUser; return; }
  try{ await signInAnonymously(auth); }catch(e){ console.warn(e); CU=null; AUTH_ERR=(e.code||'')+' '+(e.message||''); clearTimeout(authTimer); myLoaded=true; if(view!=='shop') route(); }
}
onAuthStateChanged(auth, async u=>{
  if (!u){ CU=null; CP=null; MY=[]; myLoaded=false; if (unMine){ unMine(); unMine=null; } startAuth(); return; }
  clearTimeout(authTimer); AUTH_ERR=null; CU=u;
  await loadProfile(); watchMine();
  if (view==='shop'&&step!==4&&P){ const f=document.activeElement; if (!f||!f.closest||!f.closest('#app input,#app textarea')) renderShop(); else refreshProgress(); }
  else if (['account','orders','track','checkout'].includes(view)) route();
});
getRedirectResult(auth).catch(()=>{});
(function(){   // ?pk=d520 in a shared link preselects that package
  const p=new URLSearchParams(location.search).get('pk'); if (p) cart=[{id:p,qty:1}];
})();
function priceFail(){
  if (P) return;
  if (new URLSearchParams(location.search).get('o')){ P={shop:{},packages:[],stats:{}}; paintShell(); route(); return; }
  $('app').innerHTML=`<section class="card"><div class="state"><div class="emo">🛠️</div><b>Ordering isn’t open right now.</b>Please message the shop directly.<p><button class="btn solid" type="button" onclick="location.reload()">Try again</button></p></div></section>`;
}
paintShell();
onSnapshot(doc(db,'public','pay'), s=>{ PAY=s.exists()?s.data():{}; refreshPay();
  if (Object.keys(PAY.qrData||{}).length) loadLib(QRLIB.gen,'qrcode').then(refreshPay).catch(e=>console.warn('qr lib',e)); }, e=>console.warn('pay',e));
onSnapshot(doc(db,'public','prices'), s=>{
  if (!s.exists()||!(s.data().packages||[]).length){ priceFail(); return; }
  const first=!P; P=s.data(); P.shop=P.shop||{}; P.stats=P.stats||{};
  cart=cart.filter(l=>pk(l.id)); paintShell(); startTicker();
  if (first) route();
  else if (view==='shop'&&step!==4){ const f=document.activeElement; if (f&&f.closest&&f.closest('#app input,#app textarea')) refreshCart(); else renderShop(); }
  else if (view==='checkout') renderCheckout();
}, e=>{ console.error(e); priceFail(); });
</script>
