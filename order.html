<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#16222B"/>
<meta name="description" content="Order Free Fire diamonds online. Pick a package, enter your UID, pay with eSewa, Khalti or bank, and track your order live."/>
<title>Free Fire Diamonds · Order online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#14202A;--ink-2:#3A4852;--muted:#6B7880;--line:#E6EAEC;--line-2:#D3DADD;--bg:#F5F6F7;--card:#fff;
  --accent:#B8233A;--accent-2:#9A1B2F;--accent-soft:#FCEFF1;--ok:#22744A;--ok-soft:#E8F4EC;--ok-bar:#2E9A5E;--warn:#8A5A10;--warn-soft:#FFF5E3;--blue:#2F5B94;--blue-soft:#EDF2F9;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--nep:"Mukta","Bricolage Grotesque",system-ui,sans-serif;
  --nav-h:62px;--r:16px;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
body.ne{font-family:var(--nep)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* header */
.appbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.mono{width:36px;height:36px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shop{min-width:0;flex:1}
.shop b{display:flex;align-items:center;gap:5px;font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop b svg{flex-shrink:0}
.shop small{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok-bar);flex-shrink:0}
.live.off{background:var(--accent)}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:none;background:none;color:var(--muted);padding:5px 10px;font-size:.74rem;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
main{padding-top:14px}

/* game banner */
.banner{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--ink);color:#fff;margin-bottom:12px}
.banner .gi{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.banner h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.banner p{margin:2px 0 0;font-size:.82rem;color:#AEBBC2}
.banner .trust{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:.76rem;color:#DDE5E9}

/* sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0}
.card-h h2{margin:0;font-size:1rem;font-weight:800;display:flex;align-items:center;gap:10px}
.card-h h2 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.76rem;flex-shrink:0}
.card-h h2 .n.ok{background:var(--ok-bar)}
.card-h .link{font-size:.8rem}
.card-b{padding:12px 16px 16px}
.sec-plain .card-h{padding-bottom:12px;border-bottom:1px solid var(--line)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin-bottom:12px;font-size:.88rem;background:#fff;border:1px solid var(--line)}
.notice.closed{background:var(--accent-soft);border-color:#F2CDD3;color:var(--accent-2)}
.notice b{display:block}
.chip-line{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.84rem;font-weight:600;margin-bottom:12px}

/* fields */
.field{display:grid;gap:6px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.lab{font-size:.84rem;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lab em{font-style:normal;font-weight:500;color:var(--muted);font-size:.78rem}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:700;font-size:.82rem;text-decoration:none}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:12px;background:#fff;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,32,42,.07)}
input.big{font-size:1.2rem;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;padding:13px 14px}
input.bad{border-color:var(--accent)}
textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.howto{padding:10px 12px;border-radius:12px;background:var(--blue-soft);color:var(--ink-2);font-size:.84rem;margin-top:8px}
.howto ol{margin:4px 0 0;padding-left:18px}
.uids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.uids button,.uids span{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);margin-top:4px}
.check input{width:17px;height:17px;accent-color:var(--ink)}
.err{color:var(--accent);font-weight:700;font-size:.86rem;margin:6px 0 0}
.err:empty{display:none}

/* packages: Codashop-style grid */
.grp{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:2px 0 8px}
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.pkgs:last-child{margin-bottom:0}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:14px 6px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;transition:border-color .12s,background .12s}
.pk:disabled{opacity:.5}
.pk .ic{height:26px;display:flex;align-items:center}
.pk b{font-size:1.05rem;font-weight:800;line-height:1.2}
.pk .u{font-size:.68rem;color:var(--muted);font-weight:600}
.pk .pr{margin-top:6px;font-weight:800;font-size:.92rem;color:var(--ink)}
.pk.on{border-color:var(--accent);background:var(--accent-soft)}
.pk.on .pr{color:var(--accent)}
.pk .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--ok-bar);color:#fff;font-style:normal}
.pk .tag.pop{background:var(--ink)}
.pk .cnt{position:absolute;top:6px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;font-style:normal}
.more{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.84rem;color:var(--muted)}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.calc-res{grid-column:1/-1;font-size:.84rem;color:var(--ok);font-weight:700}
.upsell{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--ok-soft);font-size:.84rem;color:var(--ok);margin-top:12px}
.upsell b{font-weight:800}

/* order lines */
.lines{border:1px solid var(--line);border-radius:12px;margin-top:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row b{font-weight:700;font-size:.92rem}
.row small{display:block;font-size:.74rem;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{width:32px;height:32px;border:none;background:var(--bg);font-size:1.05rem;font-weight:700}
.qty span{min-width:28px;text-align:center;font-weight:700;font-size:.9rem}

/* payment */
.paym{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.paym button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.8rem}
.paym button i{font-style:normal;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff}
.paym button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.payinfo{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.86rem;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.payinfo b{display:block;color:var(--ink);font-size:.8rem}

/* trust + faq */
.trust3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.trust3 div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:.74rem;color:var(--muted)}
.trust3 b{display:block;font-size:1.1rem;margin-bottom:2px}
.trust3 strong{display:block;color:var(--ink);font-size:.78rem}
.faq details{border-top:1px solid var(--line)}
.faq details:first-of-type{border-top:none}
.faq summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:800;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0;padding:0 16px 13px;color:var(--ink-2);font-size:.88rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:#fff;font-weight:800;text-decoration:none;color:var(--ink);text-align:center}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.8rem;border-radius:10px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;gap:10px}

/* sticky buy bar + bottom nav */
.cbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:15;background:#fff;border-top:1px solid var(--line)}
.cbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px}
.cbar .tot{flex:1;min-width:0}
.cbar small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar b{font-size:1.25rem;font-weight:800}
.cbar .btn{min-width:150px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:700;position:relative}
.bnav a svg{width:22px;height:22px}
.bnav a.on{color:var(--ink)}
.bnav .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:.64rem;display:flex;align-items:center;justify-content:center}

/* confirm sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,32,42,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s}
@media(min-width:600px){.sheet{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:20px;animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:1.1rem}

/* summary blocks (confirm, done, track) */
.uidbox{text-align:center;padding:14px;border-radius:14px;border:1.5px dashed var(--ink-2);margin-bottom:12px}
.uidbox span{display:block;font-size:.76rem;color:var(--muted);font-weight:700}
.uidbox b{display:block;font-size:1.8rem;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.uidbox small{color:var(--muted);font-size:.76rem}
.sum{background:var(--bg);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:.9rem}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum .t{border-top:1px solid var(--line-2);margin-top:6px;padding-top:9px;font-size:1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;margin:0 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.pay{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink-2);font-size:.9rem;margin-bottom:12px;display:grid;gap:8px;text-align:left}
.pay b{display:block}
.pay .cp{justify-self:start}
.done{text-align:center}
.done .big{width:64px;height:64px;margin:4px auto 6px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800}
.done h2{margin:6px 0 4px;font-size:1.35rem}
.done p{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.code{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line-2);font-weight:800;letter-spacing:.06em;margin-bottom:12px;font-size:.9rem}
.paidf{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;margin-bottom:12px}
.paidf label{grid-column:1/-1;font-size:.84rem;font-weight:700}
.paidok{padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:.88rem;margin-bottom:12px}
.tl{list-style:none;margin:0 0 14px;padding:0;text-align:left}
.tl li{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;padding:0 0 16px}
.tl li::before{content:"";position:absolute;left:15px;top:30px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl .dot{width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:var(--muted);position:relative;z-index:1}
.tl li.ok .dot{background:var(--ok-bar);border-color:var(--ok-bar);color:#fff}
.tl li.ok::before{background:var(--ok-bar)}
.tl li.now .dot{background:#fff;border-color:var(--ink);color:var(--ink)}
.tl li.bad .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tl b{display:block;padding-top:5px}
.tl small{color:var(--muted);font-size:.8rem}
.reason{padding:12px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:12px}
.reason b{display:block;color:var(--accent-2)}
.reason small{color:var(--ink-2)}
.ohist{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ohist:first-of-type{border-top:none}
.ohist small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.sb{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.sb.new{background:var(--warn-soft);color:var(--warn)}.sb.done{background:var(--blue-soft);color:var(--blue)}.sb.dlv{background:var(--ok-soft);color:var(--ok)}.sb.rej,.sb.can{background:var(--accent-soft);color:var(--accent-2)}
.acct{display:grid;gap:12px}
.idcard{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--ink);color:#fff}
.idcard span{display:block;font-size:.74rem;color:#AEBBC2}
.idcard b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:.06em}
.idcard small{color:#C9D3D8;font-size:.78rem}
.idcard .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.hint{margin:0;font-size:.82rem;color:var(--muted)}
.gbox{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line-2)}
.gbox b{display:block;font-size:.92rem}.gbox small{color:var(--muted);font-size:.78rem}
.gbox .g{width:20px;height:20px;border-radius:50%;background:#fff;color:#4285F4;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.stats span{font-size:.7rem;color:var(--muted)}
.stats b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.prog{height:6px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--warn);border-radius:999px}
.state{padding:36px 16px;text-align:center;color:var(--muted)}
.state b{color:var(--ink);display:block;font-size:1rem;margin-bottom:4px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,#eceff0 25%,#f6f7f8 50%,#eceff0 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:.88rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:.76rem;padding:4px 16px 130px}
@media(max-width:360px){.pkgs{grid-template-columns:repeat(2,minmax(0,1fr))}.paym{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<header class="appbar">

function bestMix(N){
  const list=P.packages.filter(p=>p.kind!=='member'&&p.diamonds>0); if(!list.length||!(N>0)||N>200000) return null;
  const dp=new Float64Array(N+1).fill(1e15), pick=new Int32Array(N+1).fill(-1); dp[0]=0;
  for(let a=1;a<=N;a++) for(let i=0;i<list.length;i++){ const v=dp[Math.max(0,a-list[i].diamonds)]+list[i].price; if(v<dp[a]-1e-9){ dp[a]=v; pick[a]=i; } }
  const m=new Map(); let a=N; while(a>0){ const i=pick[a]; m.set(i,(m.get(i)||0)+1); a=Math.max(0,a-list[i].diamonds); }
  return [...m.entries()].map(([i,q])=>({id:list[i].id, qty:q}));
}
const mixPrice=m=>m.reduce((s,l)=>s+pk(l.id).price*l.qty,0), mixDia=m=>m.reduce((s,l)=>s+pk(l.id).diamonds*l.qty,0);
// honest upsell: cheaper mix for the same diamonds, or a bigger pack with a better rate
function upsell(){
  if (!cart.length || cart.some(l=>pk(l.id).kind==='member')) return null;
  const D=cartDia(), cur=total(), m=bestMix(D);
  if (m && mixPrice(m)<cur-0.5 && mixDia(m)>=D) return {kind:'swap', mix:m, save:cur-mixPrice(m)};
  if (cart.length===1){ const p=pk(cart[0].id), q=cart[0].qty; const bigger=P.packages.filter(x=>x.kind!=='member'&&x.diamonds>p.diamonds*q&&x.price/x.diamonds<p.price/p.diamonds).sort((a,b)=>a.price-b.price)[0];
    if (bigger && bigger.price-p.price*q <= p.price*q*1.1) return {kind:'up', mix:[{id:bigger.id,qty:1}], extra:bigger.price-p.price*q, more:bigger.diamonds-p.diamonds*q}; }
  return null;
}

    $('shareBtn').onclick=()=>{ const msg=t('shareMsg',P.shop.name||'us',location.origin+location.pathname); if(navigator.share) navigator.share({text:msg}).catch(()=>{}); else open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener'); };
    $('uid').addEventListener('input',()=>{ me.uid=$('uid').value.replace(/\D/g,''); const ok=cart.length>0&&/^\d{6,14}$/.test(me.uid); $('cbBtn').classList.toggle('ink',!ok); $('cbBtn').classList.toggle('accent',ok); });
  } else { $('again').onclick=()=>{ cart=[]; step=1; calcMsg=''; renderShop(); scrollTo({top:0}); }; }
  badges();
}
$('cbBtn').addEventListener('click', ()=>{
  readForm();
  const e1=$('err1'), bad=(el,msg)=>{ e1.textContent=msg; el.classList.add('bad'); el.scrollIntoView({block:'center',behavior:'smooth'}); el.focus({preventScroll:true}); setTimeout(()=>el.classList.remove('bad'),1600); };
  if ($('website').value) return;   // bot trap
  if (!/^\d{6,14}$/.test(me.uid)) return bad($('uid'), t('eUid'));
  if (!me.name) return bad($('name'), t('eName'));
  if (me.phone && me.phone.replace(/\D/g,'').length<7) return bad($('phone'), t('eWa'));
  if (!cart.length){ toast(t('pickPkg')); document.querySelector('.pkgs').scrollIntoView({block:'center',behavior:'smooth'}); return; }
  e1.textContent='';
  store.set('dc-me', me.remember?{name:me.name,phone:me.phone,uid:me.uid,remember:true}:{remember:false});
  openConfirm();
});

/* =========================================================
   ORDERS LIST + LIVE TRACKING
   ========================================================= */
function viewOrders(){
  $('cbar').hidden=true;
  const sb=o=>{ const k=stOf(o); return `<span class="sb ${k}">${t('st_'+k)}</span>`; };
  $('app').innerHTML=`<div class="view"><div class="card"><div class="card-h"><h2>${t('ordersT')}</h2>${MY.length?`<span class="hint">${MY.length}</span>`:''}</div>
    ${!myLoaded&&!AUTH_ERR?'<div class="card-b"><div class="skel" style="height:70px"></div></div>':MY.length?MY.map(o=>`<a class="ohist" href="?o=${encodeURIComponent(o.id)}"><div><b>#${esc(code(o.id))} ${sb(o)}</b><small>${esc((o.items||[]).map(i=>i.qty+' × '+(i.kind==='member'?i.name:nf(i.diamonds)+' 💎')).join(', '))}</small><small>UID ${esc(o.uid)} · ${esc(ago(o.at))}</small></div><b class="num">${rs(o.total||0)}</b></a>`).join('')
      :`<div class="state"><div style="font-size:2.4rem">🛒</div><b>${t('noOrders')}</b>${t('noOrdersP')}<p><a class="btn accent" href="#">${t('startOrder')}</a></p></div>`}
  </div></div>`;
}
function viewTrack(id){
  $('cbar').hidden=true; if (unTrack) unTrack();
  $('app').innerHTML='<div class="card"><div class="state"><span class="spin"></span></div></div>';
  unTrack=onSnapshot(doc(db,'orders',id), s=>{
    if (!s.exists()){ $('app').innerHTML=`<div class="card"><div class="state"><b>${t('notFound')}</b><p><a class="btn" href="${location.pathname}">${t('toShop')}</a></p></div></div>`; return; }
    const o={id, ...s.data()}, k=stOf(o), w=P&&waNum(P.shop.wa), mine=CU&&o.cid===CU.uid;
    const i=MY.findIndex(x=>x.id===id); if(i>=0) MY[i]=o; badges();
    document.title=(k==='dlv'?'✅ ':k==='rej'||k==='can'?'✕ ':'⏳ ')+'#'+code(id);
    const li=(cls,icon,title,sub)=>`<li class="${cls}"><span class="dot">${icon}</span><div><b>${title}</b><small>${sub}</small></div></li>`;
    const rsn=(t('reasons')[o.reason]||t('reasons').other);
    const steps= k==='rej' ? li('ok','✓',t('st1'),esc(ago(o.at)))+li('bad','✕',t('rej'),esc(rsn[0]))
      : k==='can' ? li('ok','✓',t('st1'),esc(ago(o.at)))+li('bad','✕',t('canT'),o.cancelledAt?esc(ago(o.cancelledAt)):'')
      : li('ok','✓',t('st1'),esc(ago(o.at)))+li(k==='new'?'now':'ok',k==='new'?'2':'✓',t('st2'),k==='new'?(o.paidAt?t('paidOk'):t('st2w')):(o.doneAt?esc(ago(o.doneAt)):''))+li(k==='dlv'?'ok':k==='done'?'now':'',k==='dlv'?'✓':'3',t('st3'),k==='dlv'&&o.deliveredAt?esc(ago(o.deliveredAt)):t('st3w'));
    const canReorder=P&&P.packages.length&&(o.items||[]).some(x=>P.packages.some(p=>p.id===x.pkId));
    $('app').innerHTML=`<div class="view"><div class="card"><div class="card-h"><h2>${t('trackT')}</h2><span class="code" style="margin:0;padding:5px 12px;font-size:.82rem">#${esc(code(id))}</span></div><div class="card-b">
      ${['new','done'].includes(k)?`<p class="hint" style="margin:-4px 0 12px"><i class="live" style="display:inline-block;margin-right:6px"></i>${t('liveUpd')}</p>`:''}
      <ol class="tl">${steps}</ol>
      ${k==='rej'?`<div class="reason"><b>${esc(rsn[0])}</b><small>${esc(rsn[1])}</small></div>`:''}
      ${mine&&k==='new'?paidForm(o):''}
      <div class="sum">${(o.items||[]).map(x=>`<div><span>${x.qty} × ${esc(x.kind==='member'?x.name:nf(x.diamonds)+' 💎')}</span><b class="num">${rs(x.price*x.qty)}</b></div>`).join('')}<div class="t"><b>${t('total')}</b><b class="num">${rs(o.total||0)}</b></div></div>
      <dl class="kv"><dt>UID</dt><dd>${esc(o.uid)}</dd><dt>${t('name')}</dt><dd>${esc(o.name)}</dd><dt>${t('payBy')}</dt><dd>${esc(o.method||'')}</dd></dl>
      <div class="btns">
        ${canReorder&&['dlv','rej','can'].includes(k)?`<button class="btn accent block" type="button" id="reorder">↻ ${t('another')}</button>`:''}
        ${w?`<a class="btn wa block" href="https://wa.me/${w}?text=${encodeURIComponent('#'+code(id)+' ')}" target="_blank" rel="noopener">${t('msgShop')}</a>`:''}
        ${mine&&k==='new'?`<button class="btn ghost block" type="button" id="cancelBtn">${t('cancel')}</button>`:''}
        <a class="btn block" href="#orders">${t('ordersT')}</a>
      </div></div></div></div>`;
    const ro=$('reorder'); if(ro) ro.onclick=()=>{ cart=(o.items||[]).filter(x=>P.packages.some(p=>p.id===x.pkId)).map(x=>({id:x.pkId,qty:x.qty})); step=1; nav('shop'); };
    const cb=$('cancelBtn'); if(cb) cb.onclick=async()=>{ if(!confirm(t('cancelQ'))) return; try{ await setDoc(doc(db,'orders',id),{status:'cancelled',cancelledAt:Date.now()},{merge:true}); toast(t('cancelled')); }catch(e){ console.warn(e); toast(t('sendFail')); } };
  }, e=>{ console.warn(e); $('app').innerHTML=`<div class="card"><div class="state"><b>${t('notFound')}</b></div></div>`; });
}
document.addEventListener('click', async e=>{
  const pb=e.target.closest('[data-paid]'); if(!pb) return;
  const id=pb.dataset.paid, ref=($('paidRef').value||'').trim().slice(0,40);
  pb.disabled=true;
  try{ await setDoc(doc(db,'orders',id),{paidAt:Date.now(), paidRef:ref},{merge:true}); const o=MY.find(x=>x.id===id); if(o){ o.paidAt=Date.now(); o.paidRef=ref; } if(last&&last.id===id){ last.paidAt=Date.now(); last.paidRef=ref; if(step===4) renderShop(); } toast(t('paidOk')); }
  catch(err){ console.warn(err); toast(t('sendFail')); pb.disabled=false; }
});

/* =========================================================
   ACCOUNT
   ========================================================= */
const mkCode=()=>{ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s='C-'; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; };
async function loadProfile(){
  const ref=doc(db,'customers',CU.uid); let s=null; PROFILE_ERR=null;
  try{ s=await getDoc(ref); }catch(e){ console.warn(e); PROFILE_ERR=e.code||'error'; }
  if (s&&s.exists()) CP=s.data();
  else { CP={code:mkCode(), name:me.name||'', phone:me.phone||'', ffUids:me.uid?[me.uid]:[], createdAt:Date.now(), updatedAt:Date.now(), email:CU.email||''}; if(!PROFILE_ERR){ try{ await setDoc(ref,CP); }catch(e){ console.warn(e); PROFILE_ERR=e.code||'error'; } } }
  if (!me.name&&CP.name) me.name=CP.name; if (!me.phone&&CP.phone) me.phone=CP.phone; if (!me.uid&&(CP.ffUids||[])[0]) me.uid=CP.ffUids[0];
}
async function saveProfile(patch){ CP={...CP, ...patch, updatedAt:Date.now(), email:(CU&&CU.email)||''}; try{ await setDoc(doc(db,'customers',CU.uid),CP); return true; }catch(e){ console.warn(e); return false; } }
async function loadMine(){
  if (!CU) return; try{ const s=await getDocs(query(collection(db,'orders'), where('cid','==',CU.uid))); MY=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at); }catch(e){ console.warn(e); }
  myLoaded=true; badges();
}
async function googleSave(){
  const prov=new GoogleAuthProvider();
  try{
    if (CU&&CU.isAnonymous){ try{ await linkWithPopup(CU,prov); }catch(e){
        if ((e.code||'').includes('credential-already-in-use')){ await signInWithCredential(auth, GoogleAuthProvider.credentialFromError(e)); }
        else if (/popup-blocked|operation-not-supported/.test(e.code||'')){ await linkWithRedirect(CU,prov); return; } else throw e; } }
    else await signInWithPopup(auth,prov);
    CU=auth.currentUser; await loadProfile(); await saveProfile({}); await loadMine(); toast(t('saved')); viewAccount();
  }catch(e){ console.warn(e); toast(t('gFail')); }
}
function viewAccount(){
  $('cbar').hidden=true;
  if (AUTH_ERR){
    const off=/operation-not-allowed|admin-restricted/.test(AUTH_ERR), dom=/unauthorized-domain|requests-from-referer/.test(AUTH_ERR);
    $('app').innerHTML=`<div class="card"><div class="state"><div style="font-size:2rem">⚠️</div><b>${off?t('authOff'):t('authFail')}</b><p class="hint">${esc(off?'Firebase → Authentication → Sign-in method → enable Anonymous':dom?'Firebase → Authentication → Settings → Authorized domains → add '+location.hostname:'')}</p><p class="hint" style="font-size:.72rem">${esc(AUTH_ERR)}</p><p><button class="btn ink" type="button" id="retryAuth">↻</button></p></div></div>`;
    $('retryAuth').onclick=startAuth; return; }
  if (!CU||!CP){ $('app').innerHTML='<div class="skel"></div>'; return; }
  const acc=MY.filter(o=>o.status==='done'), spent=acc.reduce((s,o)=>s+(o.total||0),0), dia=acc.reduce((s,o)=>s+(o.items||[]).reduce((x,i)=>x+i.diamonds*i.qty,0),0);
  $('app').innerHTML=`<div class="view"><div class="card"><div class="card-b acct">
      <div class="idcard"><div><span>${t('youId')}</span><b>${esc(CP.code)}</b><small>${CU.isAnonymous?t('guest'):esc(t('googleAcc',CU.email||'Google'))}</small></div><button class="btn sm" type="button" data-copy="${esc(CP.code)}">${t('copy')}</button></div>
      ${PROFILE_ERR?`<div class="notice closed" style="margin:0"><span>⚠️</span><div><b>${L==='ne'?'खाता सेभ हुन सकेन':'Account can’t be saved yet'}</b><small>${esc(PROFILE_ERR)}</small></div></div>`:''}
      <p class="hint">${t('idHint')}</p>
      ${CU.isAnonymous?`<div class="gbox"><div><b>${t('saveG')}</b><small>${t('saveGP')}</small></div><button class="btn ink" type="button" id="gSave"><span class="g">G</span>Google</button></div>`:''}
      <div class="stats"><div><span>${t('statOrders')}</span><b>${MY.length}</b></div><div><span>${t('statSpent')}</span><b>${rs(spent)}</b></div><div><span>${t('statDia')}</span><b>${nf(dia)}</b></div><div><span>${t('statWait')}</span><b>${active()}</b></div></div>
    </div></div>
    ${P?loyaltyNote():''}
    <div class="card"><div class="card-h"><h2>${t('profile')}</h2></div><div class="card-b">
      <label class="field"><span class="lab">${t('name')}</span><input type="text" id="pName" maxlength="60" value="${esc(CP.name||'')}"/></label>
      <label class="field"><span class="lab">${t('wa')}</span><input type="tel" id="pPhone" maxlength="15" value="${esc(CP.phone||'')}"/></label>
      ${(CP.ffUids||[]).length?`<div class="field"><span class="lab">${t('ffUids')}</span><div class="uids">${CP.ffUids.map(u=>`<span>${esc(u)}</span>`).join('')}</div></div>`:''}
      <div class="btns"><button class="btn ink" type="button" id="pSave">${t('saveBtn')}</button>${!CU.isAnonymous?`<button class="btn ghost" type="button" id="outBtn">${t('signOut')}</button>`:''}</div>
    </div></div></div>`;
  const g=$('gSave'); if(g) g.onclick=googleSave;
  const out=$('outBtn'); if(out) out.onclick=async()=>{ await signOut(auth); };
  $('pSave').onclick=async()=>{ const ok=await saveProfile({name:$('pName').value.trim().slice(0,60), phone:$('pPhone').value.trim().slice(0,15)}); me.name=CP.name; me.phone=CP.phone; toast(ok?t('saved'):t('sendFail')); };
}

/* =========================================================
   EVENTS + ROUTING
   ========================================================= */
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-pick]'); if(a){ const id=a.dataset.pick, l=cart.find(x=>x.id===id); if(l) l.qty++; else cart=[{id,qty:1}]; calcMsg=''; buzz(); renderShop(); return; }
  const q=e.target.closest('[data-q]'); if(q){ const i=+q.closest('[data-i]').dataset.i; cart[i].qty+=+q.dataset.q; if(cart[i].qty<1) cart.splice(i,1); renderShop(); return; }
  const m=e.target.closest('[data-m]'); if(m){ method=m.dataset.m; document.querySelectorAll('#method button').forEach(b=>b.setAttribute('aria-pressed',String(b===m))); buzz(); return; }
  const uu=e.target.closest('[data-useuid]'); if(uu){ $('uid').value=uu.dataset.useuid; return; }
  const c=e.target.closest('[data-copy]'); if(c){ copy(c.dataset.copy); }
});
function nav(v){ history.pushState(null,'',location.pathname+(v==='orders'?'#orders':v==='account'?'#account':'')); route(); scrollTo({top:0}); }
document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); nav(a.dataset.nav); }));
addEventListener('popstate', route);
addEventListener('hashchange', ()=>{ if(new URLSearchParams(location.search).get('o')) history.replaceState(null,'',location.pathname+location.hash); route(); scrollTo({top:0}); });
function route(){
  const id=new URLSearchParams(location.search).get('o'), h=location.hash;
  view = id?'track': h==='#orders'?'orders': h==='#account'?'account':'shop';
  if (view!=='track'&&unTrack){ unTrack(); unTrack=null; document.title=(P&&P.shop.name?P.shop.name+' · ':'')+'Free Fire Diamonds'; }
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===(view==='track'?'orders':view)));
  if (!P && view!=='track') return;
  if (view==='track') viewTrack(id); else if (view==='orders') viewOrders(); else if (view==='account') viewAccount(); else renderShop();
}

/* =========================================================
   START
   ========================================================= */
async function startAuth(){
  AUTH_ERR=null; if(view==='account') viewAccount();
  clearTimeout(authTimer); authTimer=setTimeout(()=>{ if(!CU){ AUTH_ERR='timeout: sign-in did not respond'; if(view==='account'||view==='orders') route(); } },12000);
  if (auth.currentUser){ CU=auth.currentUser; return; }
  try{ await signInAnonymously(auth); }catch(e){ console.warn(e); CU=null; AUTH_ERR=(e.code||'')+' '+(e.message||''); clearTimeout(authTimer); myLoaded=true; if(view!=='shop') route(); }
}
onAuthStateChanged(auth, async u=>{
  if (!u){ startAuth(); return; }
  clearTimeout(authTimer); AUTH_ERR=null; CU=u;
  await loadProfile(); await loadMine(); if (view!=='shop' || step!==4) route();
});
getRedirectResult(auth).catch(()=>{});
(async()=>{
  paintShell();
  try{
    const s=await getDoc(doc(db,'public','prices'));
    if (!s.exists()||!(s.data().packages||[]).length) throw new Error('empty');
    P=s.data(); P.shop=P.shop||{};
    if (P.shop.name){ $('shopName').textContent=P.shop.name; document.title=P.shop.name+' · Free Fire Diamonds'; }
    paintShell(); route();
  }catch(e){
    console.error(e);
    if (new URLSearchParams(location.search).get('o')){ P={shop:{},packages:[]}; route(); return; }
    $('app').innerHTML=`<div class="card"><div class="state"><b>${t('loadFail')}</b>${t('loadFailP')}</div></div>`;
  }
})();
</script>
