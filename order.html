<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#16222B"/>
<meta name="description" content="Order Free Fire diamonds online. Pick a package, enter your UID, pay with eSewa, Khalti or bank, and track your order."/>
<title>Order Free Fire Diamonds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#16222B;--ink-2:#33434C;--muted:#5C6B72;--line:#E1E6E7;--line-2:#CDD6D7;--bg:#F3F5F5;--accent:#B8233A;--accent-2:#9A1B2F;--accent-soft:#FBEAEC;--ok:#2F6B4C;--ok-soft:#E5F2EA;--ok-bar:#3E8E63;--warn:#9A6212;--warn-soft:#FFF4E0;--blue:#2F5B94;--blue-soft:#E8EEF7;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--nep:"Mukta","Bricolage Grotesque",system-ui,sans-serif;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.ne{font-family:var(--nep)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:relative;overflow:hidden;background:linear-gradient(150deg,#16222B,#22333E);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 0 58px}
header svg.r{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;min-width:0}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{width:38px;height:38px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lang{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:none;background:none;color:#B9C6CB;padding:6px 11px;font-size:.8rem;font-weight:700}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
header h1{font-size:clamp(1.65rem,7vw,2.2rem);line-height:1.12;margin:18px 0 6px;letter-spacing:-.02em;font-weight:800}
header p{margin:0;color:#B9C6CB}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.trust span{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:.8rem;color:#DCE4E7}
main{margin-top:-32px;position:relative;padding-bottom:130px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:14px;box-shadow:0 10px 30px -22px rgba(22,34,43,.45)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:1.06rem;font-weight:700}
.card-b{padding:16px 18px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:12px;font-size:.92rem}
.notice.info{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue)}
.notice.closed{background:var(--accent-soft);border:1px solid #F1C9CF;color:var(--accent-2)}
.notice b{display:block}

/* steps */
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps div{flex:1;display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.steps div span{width:22px;height:22px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:800;flex-shrink:0}
.steps div em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps div.on{border-color:var(--ink);color:var(--ink)}
.steps div.on span{background:var(--ink);color:#fff}
.steps div.ok span{background:var(--ok-bar);color:#fff}

/* my orders */
.mine{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px}
.mine::-webkit-scrollbar{display:none}
.mine a{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.84rem}
.mine a b{font-weight:800}
.mine a small{color:var(--muted)}

/* packages */
.grp{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:6px 0 8px}
.pkgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.pk{position:relative;display:grid;gap:1px;text-align:left;padding:14px 14px 12px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;transition:border-color .15s,box-shadow .15s,transform .1s}
.pk:hover{border-color:var(--ink)}
.pk:active{transform:scale(.98)}
.pk b{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:6px}
.pk .pr{font-weight:800;color:var(--accent);font-size:1.02rem}
.pk small{font-size:.74rem;color:var(--muted)}
.pk.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pk .cnt{position:absolute;top:-9px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;font-style:normal}
.tag{position:absolute;top:-9px;left:10px;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.02em;font-style:normal}
.tag.best{background:var(--ok-bar);color:#fff}
.tag.pop{background:#FFB020;color:#3B2600}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-radius:14px;background:var(--bg);margin-bottom:16px}
.calc label{grid-column:1/-1;font-size:.88rem;color:var(--ink-2);font-weight:600}
.calc-res{grid-column:1/-1;font-size:.86rem;color:var(--ok);font-weight:600}
.cart{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cart:empty{display:none}
.cart-h{padding:8px 12px;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;background:#FAFBFB;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.cart-h+.row{border-top:none}
.row b{font-weight:700}
.row small{display:block;font-size:.76rem;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:none;background:var(--bg);font-size:1.1rem;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:700}

/* form */
.field{display:grid;gap:6px;margin-bottom:14px}
.lab{font-size:.88rem;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lab em{font-style:normal;font-weight:500;color:var(--muted);font-size:.8rem}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:600;font-size:.82rem;text-decoration:underline}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,34,43,.08)}
input.big{font-size:1.25rem;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical}
.howto{padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--ink-2);font-size:.88rem;margin:-4px 0 14px}
.howto ol{margin:6px 0 0;padding-left:20px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 4px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink-2);margin:4px 0 6px}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.err{color:var(--accent);font-weight:600;font-size:.9rem;min-height:1.2em;margin:0 0 6px}

/* review */
.uidbox{text-align:center;padding:16px;border-radius:14px;border:2px dashed var(--ink);margin-bottom:14px}
.uidbox span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.uidbox b{display:block;font-size:2rem;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;margin:2px 0}
.uidbox small{color:var(--muted);font-size:.8rem}
.sum{background:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum .t{border-top:1px solid var(--line-2);margin-top:6px;padding-top:10px;font-size:1.05rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.pay{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink-2);font-size:.92rem;margin-bottom:14px;display:grid;gap:8px}
.pay b{display:block}
.pay .cp{justify-self:start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-weight:700;text-decoration:none;color:var(--ink);text-align:center}
.btn.sm{min-height:34px;padding:0 12px;font-size:.84rem;border-radius:10px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btns{display:grid;gap:10px}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 30px -20px rgba(22,34,43,.5)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.bar .tot{flex:1;min-width:0}
.bar .tot small{display:block;color:var(--muted);font-size:.8rem}
.bar .tot b{font-size:1.3rem;font-weight:800}
.bar .btn{min-width:150px}

/* done / tracking */
.done{text-align:center}
.done .big{font-size:3rem;line-height:1}
.done h2{margin:8px 0 4px;font-size:1.45rem}
.done p{color:var(--muted);margin:0 0 14px}
.code{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;letter-spacing:.08em;margin-bottom:14px}
.tl{list-style:none;margin:0 0 16px;padding:0;text-align:left}
.tl li{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:0 0 18px}
.tl li::before{content:"";position:absolute;left:16px;top:32px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl .dot{width:34px;height:34px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800;color:var(--muted);position:relative;z-index:1}
.tl li.ok .dot{background:var(--ok-bar);border-color:var(--ok-bar);color:#fff}
.tl li.ok::before{background:var(--ok-bar)}
.tl li.now .dot{background:#fff;border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px rgba(22,34,43,.08)}
.tl li.bad .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tl b{display:block;padding-top:6px}
.tl small{color:var(--muted);font-size:.82rem}

/* faq */
.faq details{border-top:1px solid var(--line)}
.faq details:first-of-type{border-top:none}
.faq summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:800;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0;padding:0 18px 14px;color:var(--ink-2);font-size:.92rem}

.state{padding:44px 18px;text-align:center;color:var(--muted)}
.state b{color:var(--ink);display:block;font-size:1.05rem;margin-bottom:4px}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:6px 16px 24px}
@media(max-width:380px){.steps div em{display:none}.steps div{justify-content:center}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

function bestMix(N){
  const list=P.packages.filter(p=>p.kind!=='member'&&p.diamonds>0); if(!list.length||!(N>0)||N>200000) return null;
  const dp=new Float64Array(N+1).fill(1e15), pick=new Int32Array(N+1).fill(-1); dp[0]=0;
  for (let a=1;a<=N;a++) for (let i=0;i<list.length;i++){ const v=dp[Math.max(0,a-list[i].diamonds)]+list[i].price; if (v<dp[a]-1e-9){ dp[a]=v; pick[a]=i; } }
  const m=new Map(); let a=N; while(a>0){ const i=pick[a]; m.set(i,(m.get(i)||0)+1); a=Math.max(0,a-list[i].diamonds); }
  return [...m.entries()].map(([i,q])=>({id:list[i].id, qty:q}));
}

/* ---------- render + events ---------- */
function render(){
  const app=$('app');
  app.innerHTML = step===1 ? viewChoose() : step===2 ? viewDetails() : step===3 ? viewConfirm() : viewDone();
  const bar=$('bar'), show=step<4 && cart.length>0 && isOpen();
  bar.hidden=!show; $('barItems').textContent=t('items',count()); $('barTotal').textContent=rs(total());
  $('barBtn').textContent = step===1 ? t('cont') : step===2 ? t('review') : t('send');
  if (step===1){ const go=()=>{ const r=bestMix(Math.round(+$('need').value||0)); if(r){ cart=r; const d=r.reduce((s,l)=>s+pk(l.id).diamonds*l.qty,0); calcMsg=t('calcRes',nf(d),rs(total())); render(); } }; $('needGo').onclick=go; $('need').onkeydown=e=>{ if(e.key==='Enter') go(); }; }
  if (step===2){ $('howBtn').onclick=()=>{ $('howto').hidden=!$('howto').hidden; }; }
  if (step===4){ $('again').onclick=()=>{ cart=[]; step=1; calcMsg=''; render(); scrollTo({top:0}); }; }
}

  const a=e.target.closest('[data-add]'); if(a){ const l=cart.find(x=>x.id===a.dataset.add); if(l) l.qty++; else cart.push({id:a.dataset.add, qty:1}); calcMsg=''; render(); return; }
  const q=e.target.closest('[data-q]'); if(q){ const i=+q.closest('[data-i]').dataset.i; cart[i].qty+=+q.dataset.q; if(cart[i].qty<1) cart.splice(i,1); render(); return; }
  const m=e.target.closest('[data-m]'); if(m){ method=m.dataset.m; document.querySelectorAll('#method button').forEach(b=>b.setAttribute('aria-pressed',String(b===m))); return; }
  const g=e.target.closest('[data-go]'); if(g){ if(step===2) readDetails(); step=+g.dataset.go; render(); scrollTo({top:0,behavior:'smooth'}); return; }
  const c=e.target.closest('[data-copy]'); if(c){ copy(c.dataset.copy); }
});
$('barBtn').addEventListener('click', async ()=>{
  if (step===1){ step=2; render(); scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>{ const u=$('uid'); if(u&&!u.value) u.focus(); },350); return; }
  if (step===2){
    const err=x=>{ $('err').textContent=x; };
    if ($('website').value) return;   // bot trap
    readDetails();
    if (!/^\d{6,14}$/.test(me.uid)) { err(t('eUid')); $('uid').focus(); return; }
    if (!me.name) { err(t('eName')); $('name').focus(); return; }
    if (me.phone && me.phone.replace(/\D/g,'').length<7) { err(t('eWa')); $('phone').focus(); return; }
    store.set('dc-me', me.remember ? {name:me.name, phone:me.phone, uid:me.uid, remember:true} : {remember:false});
    step=3; render(); scrollTo({top:0,behavior:'smooth'}); return;
  }
  if (step===3){
    const err=x=>{ $('err').textContent=x; };
    if (Date.now()-(+store.get('dc-last-order',0))<60000) { err(t('eWait')); return; }
    const items=cart.map(l=>{ const p=pk(l.id); return {pkId:p.id, name:p.name, diamonds:p.diamonds, kind:p.kind, qty:l.qty, price:p.price}; });
    const b=$('barBtn'); b.disabled=true; b.textContent='…';
    try{
      const data={name:me.name, phone:me.phone, uid:me.uid, items, method, note:me.note||'', at:Date.now(), status:'new', total:total()};
      const ref=await addDoc(collection(db,'orders'), data);
      store.set('dc-last-order', Date.now());
      store.set('dc-orders', [{id:ref.id, at:data.at, total:data.total}, ...store.get('dc-orders',[])].slice(0,20));
      last={id:ref.id, ...data}; me.note=''; step=4; render(); scrollTo({top:0,behavior:'smooth'});
    }catch(e2){ console.error(e2); err(t('sendFail')); b.disabled=false; b.textContent=t('send'); }
  }
});

function route(){
  const id=new URLSearchParams(location.search).get('o');
  if (id) viewTrack(id); else render();
}
(async()=>{
  paintStatic();
  try{
    const s=await getDoc(doc(db,'public','prices'));
    if (!s.exists() || !(s.data().packages||[]).length) throw new Error('empty');
    P=s.data(); P.shop=P.shop||{};
    if (P.shop.name){ $('shopName').textContent=P.shop.name; document.title=(L==='ne'?'डायमन्ड अर्डर · ':'Order diamonds · ')+P.shop.name; }
    paintStatic(); route();
  }catch(e){
    console.error(e);
    const id=new URLSearchParams(location.search).get('o');
    if (id){ P={shop:{},packages:[]}; viewTrack(id); return; }
    $('app').innerHTML=`<div class="card"><div class="state"><b>${t('loadFail')}</b>${t('loadFailP')}</div></div>`;
  }
})();
</script>
