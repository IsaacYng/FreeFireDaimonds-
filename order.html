<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#16222B"/>
<title>Order Free Fire Diamonds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#16222B;--ink-2:#33434C;--muted:#5C6B72;--line:#E1E6E7;--line-2:#CDD6D7;--bg:#F3F5F5;--accent:#B8233A;--accent-2:#9A1B2F;--accent-soft:#FBEAEC;--ok:#2F6B4C;--ok-soft:#E5F2EA;--warn:#9A6212;--warn-soft:#FFF4E0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header{position:relative;overflow:hidden;background:linear-gradient(150deg,#16222B,#22333E);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 0 54px}
header svg.r{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.mono{width:38px;height:38px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center}
header h1{font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1;margin:16px 0 6px;letter-spacing:-.02em;font-weight:800}
header p{margin:0;color:#B9C6CB}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.trust span{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:.8rem;color:#DCE4E7}
main{margin-top:-30px;position:relative;padding-bottom:120px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:14px;box-shadow:0 10px 30px -22px rgba(22,34,43,.45)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:1.08rem;font-weight:700}
.step{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;margin-right:8px}
.card-b{padding:16px 18px}
.grp{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:4px 0 8px}
.pkgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pk{position:relative;display:grid;gap:2px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;transition:border-color .15s,box-shadow .15s}
.pk:hover{border-color:var(--ink)}
.pk b{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:6px}
.pk span{font-weight:700;color:var(--accent)}
.pk small{font-size:.76rem;color:var(--muted)}
.pk.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pk .cnt{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;font-style:normal}
.calc{display:flex;gap:8px;padding:12px;border-radius:12px;background:var(--bg);margin-bottom:14px;align-items:center;flex-wrap:wrap}
.calc label{font-size:.88rem;color:var(--ink-2);flex:1 1 100%}
.calc input{flex:1;min-width:0}
.cart{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cart:empty{display:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row b{font-weight:700}
.row small{display:block;font-size:.76rem;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:none;background:var(--bg);font-size:1.1rem;font-weight:700}
.qty span{min-width:32px;text-align:center;font-weight:700}
.field{display:grid;gap:6px;margin-bottom:14px}
.lab{font-size:.88rem;font-weight:600;display:flex;justify-content:space-between}
.lab em{font-style:normal;font-weight:500;color:var(--muted);font-size:.8rem}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,34,43,.08)}
textarea{min-height:70px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 4px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.pay{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink-2);font-size:.9rem;margin-bottom:14px}
.pay b{display:block}
.err{color:var(--accent);font-weight:600;font-size:.9rem;min-height:1.2em;margin:0 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-weight:700}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.block{width:100%}
a.btn{text-decoration:none;text-align:center}
.btn:disabled{opacity:.6}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 30px -20px rgba(22,34,43,.5)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.bar .tot{flex:1;min-width:0}
.bar .tot small{display:block;color:var(--muted);font-size:.8rem}
.bar .tot b{font-size:1.3rem;font-weight:800}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:26px 18px}
.done .big{font-size:3rem}
.done h2{margin:6px 0;font-size:1.4rem}
.done p{color:var(--muted);margin:0 0 14px}
.sum{text-align:left;background:var(--bg);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.state{padding:40px 18px;text-align:center;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 20px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="mono"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6-4 12"/></svg></span><span id="shopName">Free Fire Diamonds</span></div>
    <h1>Order Free Fire diamonds</h1>
    <p>Choose your diamonds, enter your UID, and we’ll top up your account.</p>
    <div class="trust"><span>⚡ Fast delivery</span><span>🎯 Straight to your UID</span><span>💳 eSewa · Khalti · Bank</span></div>
  </div>
  <svg class="r" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true"><path fill="rgba(255,255,255,.05)" d="M0 120 L120 70 L210 98 L330 40 L450 92 L560 60 L700 110 L820 52 L960 96 L1080 44 L1200 88 L1320 58 L1440 84 V220 H0Z"/><path fill="rgba(255,255,255,.07)" d="M0 160 L160 122 L300 150 L460 114 L600 146 L760 120 L900 152 L1040 126 L1200 156 L1340 130 L1440 146 V220 H0Z"/></svg>
</header>

<main class="wrap" id="app">
  <div class="card"><div class="state"><span class="spin"></span><p>Loading prices…</p></div></div>
</main>
<footer>Prices update automatically. Questions? Message the shop on WhatsApp.</footer>

<div class="bar" id="bar" hidden>
  <div class="wrap"><div class="tot"><small id="barItems">0 items</small><b id="barTotal">Rs 0</b></div><button class="btn accent" type="button" id="barBtn">Continue</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyCLSEXvViC9U_pOemMfNUkivNQSO2ayggA",
  authDomain: "free-fire-daimonds-2e4f1.firebaseapp.com",
  projectId: "free-fire-daimonds-2e4f1",
  storageBucket: "free-fire-daimonds-2e4f1.firebasestorage.app",
  messagingSenderId: "331335997414",
  appId: "1:331335997414:web:f08d9b253c82238052e827"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Math.round(n).toLocaleString('en-IN'), rs = n => 'Rs ' + nf(n);
const GEM='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5B94" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/></svg>';
const STAR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D18A1F" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
let P=null, cart=[], step=1, method='eSewa';
const pk = id => P.packages.find(p=>p.id===id);
const total = () => cart.reduce((t,l)=>t+pk(l.id).price*l.qty,0);
const items = () => cart.reduce((t,l)=>t+l.qty,0);
const waNum = p => { let d=String(p||'').replace(/\D/g,''); if (d.length===13&&d.startsWith('977')) d=d.slice(3); return /^9[78]\d{8}$/.test(d)?'977'+d:''; };

function bestMix(N){
  const list=P.packages.filter(p=>p.kind!=='member'&&p.diamonds>0); if(!list.length||!(N>0)||N>200000) return null;
  const dp=new Float64Array(N+1).fill(1e15), pick=new Int32Array(N+1).fill(-1); dp[0]=0;
  for (let a=1;a<=N;a++) for (let i=0;i<list.length;i++){ const v=dp[Math.max(0,a-list[i].diamonds)]+list[i].price; if (v<dp[a]-1e-9){ dp[a]=v; pick[a]=i; } }
  const m=new Map(); let a=N; while(a>0){ const i=pick[a]; m.set(i,(m.get(i)||0)+1); a=Math.max(0,a-list[i].diamonds); }
  return [...m.entries()].map(([i,q])=>({id:list[i].id, qty:q}));
}

function render(){
  const app=$('app');
  if (step===1){
    const top=P.packages.filter(p=>p.kind!=='member'), mem=P.packages.filter(p=>p.kind==='member'), q=id=>{ const l=cart.find(x=>x.id===id); return l?l.qty:0; };
    const tile=p=>`<button type="button" class="pk${q(p.id)?' on':''}" data-add="${esc(p.id)}"><b>${p.kind==='member'?STAR:GEM}${esc(p.kind==='member'?p.name:nf(p.diamonds))}</b><span>${rs(p.price)}</span>${p.kind==='member'?`<small>${nf(p.diamonds)} diamonds total</small>`:'<small>diamonds</small>'}${q(p.id)?`<i class="cnt">×${q(p.id)}</i>`:''}</button>`;
    app.innerHTML=`<div class="card"><div class="card-h"><h2><span class="step">1</span>Choose diamonds</h2></div><div class="card-b">
      <div class="calc"><label for="need">Need a specific amount? We’ll find the cheapest mix.</label><input type="number" id="need" min="1" inputmode="numeric" placeholder="e.g. 1000"/><button class="btn ink" type="button" id="needGo">Find</button></div>
      ${top.length?'<p class="grp">Top-up</p><div class="pkgs">'+top.map(tile).join('')+'</div>':''}
      ${mem.length?'<p class="grp">Membership</p><div class="pkgs">'+mem.map(tile).join('')+'</div>':''}
      <div class="cart">${cart.map((l,i)=>{ const p=pk(l.id); return `<div class="row" data-i="${i}"><div><b>${esc(p.kind==='member'?p.name:nf(p.diamonds)+' 💎')}</b><small>${rs(p.price)} each</small></div><div class="qty"><button type="button" data-q="-1">−</button><span>${l.qty}</span><button type="button" data-q="1">+</button></div><b>${rs(p.price*l.qty)}</b></div>`; }).join('')}</div>
    </div></div>`;
    $('needGo').onclick=()=>{ const r=bestMix(Math.round(+$('need').value||0)); if(r){ cart=r; render(); } };
    $('need').onkeydown=e=>{ if(e.key==='Enter') $('needGo').click(); };
  } else if (step===2){
    app.innerHTML=`<div class="card"><div class="card-h"><h2><span class="step">2</span>Your details</h2><button class="btn" type="button" id="back" style="min-height:36px;padding:0 12px">Back</button></div><div class="card-b">
      <div class="sum">${cart.map(l=>{ const p=pk(l.id); return `<div><span>${l.qty} × ${esc(p.kind==='member'?p.name:nf(p.diamonds)+' 💎')}</span><b>${rs(p.price*l.qty)}</b></div>`; }).join('')}<div style="border-top:1px solid var(--line-2);margin-top:6px;padding-top:8px"><b>Total</b><b>${rs(total())}</b></div></div>
      <label class="field"><span class="lab">Free Fire UID <em>required</em></span><input type="tel" inputmode="numeric" id="uid" maxlength="14" placeholder="123456789" autocomplete="off"/></label>
      <label class="field"><span class="lab">Your name</span><input type="text" id="name" maxlength="60" autocomplete="name" placeholder="Ram Rai"/></label>
      <label class="field"><span class="lab">WhatsApp number <em>so we can confirm</em></span><input type="tel" inputmode="tel" id="phone" maxlength="15" autocomplete="tel" placeholder="98XXXXXXXX"/></label>
      <div class="field"><span class="lab">I will pay by</span><div class="seg" id="method">${['eSewa','Khalti','Bank','Cash'].map(m=>`<button type="button" data-m="${m}" aria-pressed="${m===method}">${m}</button>`).join('')}</div></div>
      ${P.shop.pay?`<div class="pay"><b>How to pay</b>${esc(P.shop.pay)}</div>`:''}
      <label class="field"><span class="lab">Note <em>optional</em></span><textarea id="note" maxlength="200" placeholder="Anything we should know"></textarea></label>
      <div class="hp" aria-hidden="true"><label>Website<input type="text" id="website" tabindex="-1" autocomplete="off"/></label></div>
      <p class="err" id="err" role="alert"></p>
    </div></div>`;
    $('back').onclick=()=>{ step=1; render(); };
  }
  bar();
}
function bar(){
  const show=step<3 && cart.length>0; $('bar').hidden=!show;
  $('barItems').textContent=items()+' item'+(items()===1?'':'s'); $('barTotal').textContent=rs(total());
  $('barBtn').textContent= step===1 ? 'Continue' : 'Send order';
}
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-add]'); if(a){ const l=cart.find(x=>x.id===a.dataset.add); if(l) l.qty++; else cart.push({id:a.dataset.add, qty:1}); render(); return; }
  const q=e.target.closest('[data-q]'); if(q){ const i=+q.closest('[data-i]').dataset.i; cart[i].qty+=+q.dataset.q; if(cart[i].qty<1) cart.splice(i,1); render(); return; }
  const m=e.target.closest('[data-m]'); if(m){ method=m.dataset.m; document.querySelectorAll('#method button').forEach(b=>b.setAttribute('aria-pressed',String(b===m))); }
});
$('barBtn').addEventListener('click', async ()=>{
  if (step===1){ step=2; render(); scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>$('uid').focus(),300); return; }
  const err=t=>{ $('err').textContent=t; };
  const uid=$('uid').value.replace(/\D/g,''), name=$('name').value.trim(), phone=$('phone').value.trim(), note=$('note').value.trim();
  if ($('website').value) return;   // bot trap
  if (!/^\d{6,14}$/.test(uid)) { err('Enter your Free Fire UID (numbers only, from your profile).'); $('uid').focus(); return; }
  if (!name) { err('Enter your name.'); $('name').focus(); return; }
  if (phone && phone.replace(/\D/g,'').length<7) { err('Check your WhatsApp number.'); $('phone').focus(); return; }
  let last=0; try{ last=+localStorage.getItem('dc-last-order')||0; }catch(_){}
  if (Date.now()-last<60000) { err('You just sent an order. Please wait a minute before sending another.'); return; }
  const its=cart.map(l=>{ const p=pk(l.id); return {pkId:p.id, name:p.name, diamonds:p.diamonds, kind:p.kind, qty:l.qty, price:p.price}; });
  const b=$('barBtn'); b.disabled=true; b.textContent='Sending…';
  try{
    await addDoc(collection(db,'orders'), {name, phone, uid, items:its, method, note, at:Date.now(), status:'new', total:total()});
    try{ localStorage.setItem('dc-last-order', String(Date.now())); }catch(_){}
    done({name, uid, its, total:total()});
  }catch(e){ console.error(e); err('Couldn’t send the order. Check your internet and try again.'); b.disabled=false; bar(); }
});
function done(o){
  step=3; bar(); scrollTo({top:0,behavior:'smooth'});
  const w=waNum(P.shop.wa), msg='Namaste! Maile order pathaye 🙏\n'+o.its.map(i=>'• '+i.qty+' × '+(i.kind==='member'?i.name:i.diamonds+' diamonds')).join('\n')+'\nTotal: '+rs(o.total)+'\nUID: '+o.uid+'\nName: '+o.name;
  $('app').innerHTML=`<div class="card"><div class="done"><div class="big">✅</div><h2>Order sent!</h2><p>Thank you, ${esc(o.name)}. Your diamonds will be sent to UID <b>${esc(o.uid)}</b> once payment is confirmed.</p>
    <div class="sum">${o.its.map(i=>`<div><span>${i.qty} × ${esc(i.kind==='member'?i.name:nf(i.diamonds)+' 💎')}</span><b>${rs(i.price*i.qty)}</b></div>`).join('')}<div style="border-top:1px solid var(--line-2);margin-top:6px;padding-top:8px"><b>Pay</b><b>${rs(o.total)}</b></div></div>
    ${P.shop.pay?`<div class="pay"><b>How to pay</b>${esc(P.shop.pay)}</div>`:''}
    ${w?`<a class="btn accent block" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send payment screenshot on WhatsApp</a>`:''}
    <button class="btn block" type="button" id="again" style="margin-top:10px">Place another order</button></div></div>`;
  $('again').onclick=()=>{ cart=[]; step=1; render(); scrollTo({top:0}); };
}
(async()=>{
  try{
    const s=await getDoc(doc(db,'public','prices'));
    if (!s.exists() || !(s.data().packages||[]).length) throw new Error('empty');
    P=s.data(); P.shop=P.shop||{};
    if (P.shop.name){ $('shopName').textContent=P.shop.name; document.title='Order diamonds · '+P.shop.name; }
    render();
  }catch(e){ console.error(e); $('app').innerHTML='<div class="card"><div class="state"><b style="color:var(--ink)">Ordering isn’t open right now.</b><p>Please message the shop directly.</p></div></div>'; }
})();
</script>
</body>
</html>
