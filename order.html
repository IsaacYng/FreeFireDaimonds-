<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#16222B"/>
<meta name="description" content="Order Free Fire diamonds online. Pick a package, enter your UID, pay with eSewa, Khalti or bank, and track your order live."/>
<title>Free Fire Diamonds · Order online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#16222B;--ink-2:#33434C;--muted:#5C6B72;--line:#E1E6E7;--line-2:#CDD6D7;--bg:#F3F5F5;--card:#fff;
  --accent:#B8233A;--accent-2:#9A1B2F;--accent-soft:#FBEAEC;--ok:#2F6B4C;--ok-soft:#E5F2EA;--ok-bar:#2E9A5E;--warn:#9A6212;--warn-soft:#FFF4E0;--gold:#F5B700;--gold-soft:#FFF6D6;--blue:#2F5B94;--blue-soft:#E8EEF7;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--nep:"Mukta","Bricolage Grotesque",system-ui,sans-serif;
  --nav-h:64px;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
body.ne{font-family:var(--nep)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:rgba(22,34,43,.97);backdrop-filter:blur(8px);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.mono{width:36px;height:36px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 14px -6px rgba(184,35,58,.8)}
.shop{min-width:0;flex:1}
.shop b{display:flex;align-items:center;gap:5px;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop b svg{flex-shrink:0}
.shop small{display:flex;align-items:center;gap:6px;font-size:.74rem;color:#B9C6CB}
.live{width:8px;height:8px;border-radius:50%;background:#5BD38F;box-shadow:0 0 0 0 rgba(91,211,143,.6);animation:pulse 2s infinite}
.live.off{background:#FF7A85;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(91,211,143,0)}100%{box-shadow:0 0 0 0 rgba(91,211,143,0)}}
.lang{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:none;background:none;color:#B9C6CB;padding:6px 10px;font-size:.76rem;font-weight:700}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#16222B 0%,#22333E 70%,#2A1C24 100%);color:#fff;padding:22px 0 64px}
.hero svg.r{position:absolute;left:0;right:0;bottom:0;width:100%;height:64px;pointer-events:none}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(245,183,0,.22),transparent 65%);pointer-events:none}
.hero h1{font-size:clamp(1.6rem,7vw,2.15rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FFD54A,#F5B700);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#B9C6CB;font-size:.95rem}
.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.proof div{padding:10px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);min-width:0}
.proof b{display:block;font-size:1.15rem;font-weight:800;white-space:nowrap}
.proof span{font-size:.72rem;color:#B9C6CB}
main{margin-top:-44px;position:relative}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;box-shadow:0 12px 30px -24px rgba(22,34,43,.5)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:1.05rem;font-weight:700}
.card-b{padding:14px 16px}
.ticker{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:12px;font-size:.86rem;overflow:hidden;min-height:44px}
.ticker .bell{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.ticker .tx{flex:1;min-width:0;transition:opacity .3s,transform .3s}
.ticker .tx.out{opacity:0;transform:translateY(6px)}
.ticker b{font-weight:700}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:12px;font-size:.9rem}
.notice.info{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue)}
.notice.closed{background:var(--accent-soft);border:1px solid #F1C9CF;color:var(--accent-2)}
.notice.gift{background:linear-gradient(110deg,#FFF6D6,#FDECEF);border:1px solid #F3DFA2}
.notice b{display:block}
.prog{height:8px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F1C);border-radius:999px}

/* packages */
.grp{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 10px}
.pkgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.pk{position:relative;display:grid;gap:2px;text-align:left;padding:16px 14px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;transition:border-color .15s,box-shadow .15s,transform .1s}
.pk:hover{border-color:var(--ink-2)}
.pk:active{transform:scale(.97)}
.pk:disabled{opacity:.5}
.pk .gem{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.pk.mem .gem{background:var(--gold-soft)}
.pk b{font-size:1.25rem;font-weight:800;line-height:1.15}
.pk .pr{font-weight:800;color:var(--accent);font-size:1.05rem}
.pk small{font-size:.72rem;color:var(--muted)}
.pk .save{display:inline-block;justify-self:start;margin-top:4px;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.pk.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 10px 20px -14px rgba(22,34,43,.7)}
.pk .cnt{position:absolute;top:-9px;right:-8px;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--accent);color:#fff;font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;font-style:normal;animation:pop .25s}
@keyframes pop{0%{transform:scale(.4)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.tag{position:absolute;top:-10px;left:10px;font-size:.64rem;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.03em;font-style:normal}
.tag.best{background:var(--ok-bar);color:#fff}
.tag.pop{background:var(--gold);color:#3B2600}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-radius:14px;background:var(--bg);margin-bottom:16px}
.calc label{grid-column:1/-1;font-size:.86rem;color:var(--ink-2);font-weight:600}
.calc-res{grid-column:1/-1;font-size:.86rem;color:var(--ok);font-weight:700}
.cart{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cart-h{padding:8px 12px;font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;background:#FAFBFB;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.cart-h+.row{border-top:none}
.row b{font-weight:700}
.row small{display:block;font-size:.74rem;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:none;background:var(--bg);font-size:1.1rem;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:700}
.upsell{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--ok-soft);border-top:1px solid #CFE6D8;font-size:.86rem;color:var(--ok)}
.upsell b{font-weight:800}
.guar{display:grid;gap:10px}
.guar div{display:flex;gap:12px;align-items:flex-start}
.guar i{font-style:normal;width:36px;height:36px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.05rem}
.guar b{display:block;font-size:.94rem}
.guar small{color:var(--muted);font-size:.82rem}

/* form */
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps div{flex:1;display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.steps div span{width:22px;height:22px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:800;flex-shrink:0}
.steps div em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps div.on{border-color:var(--ink);color:var(--ink)}
.steps div.on span{background:var(--ink);color:#fff}
.steps div.ok span{background:var(--ok-bar);color:#fff}
.field{display:grid;gap:6px;margin-bottom:14px}
.lab{font-size:.88rem;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lab em{font-style:normal;font-weight:500;color:var(--muted);font-size:.8rem}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:700;font-size:.82rem;text-decoration:underline}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:12px;background:#fff;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,34,43,.08)}
input.big{font-size:1.3rem;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical}
.howto{padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--ink-2);font-size:.88rem;margin:-4px 0 14px}
.howto ol{margin:6px 0 0;padding-left:20px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 4px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:.88rem}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--ink-2);margin:4px 0 6px}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.err{color:var(--accent);font-weight:700;font-size:.9rem;min-height:1.2em;margin:0 0 6px}
.uidbox{text-align:center;padding:16px;border-radius:16px;border:2px dashed var(--ink);margin-bottom:14px;background:#FAFBFB}
.uidbox span{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.uidbox b{display:block;font-size:2rem;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;margin:2px 0}
.uidbox small{color:var(--muted);font-size:.8rem}
.sum{background:var(--bg);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum .t{border-top:1px solid var(--line-2);margin-top:6px;padding-top:10px;font-size:1.05rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0 0 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.pay{padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink-2);font-size:.92rem;margin-bottom:14px;display:grid;gap:8px;text-align:left}
.pay b{display:block}
.pay .cp{justify-self:start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:#fff;font-weight:800;text-decoration:none;color:var(--ink);text-align:center;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn.accent{background:linear-gradient(180deg,#C8283F,var(--accent));border-color:var(--accent);color:#fff;box-shadow:0 10px 20px -12px rgba(184,35,58,.9)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btns{display:grid;gap:10px}

/* bars */
.cbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:15;padding:10px 14px;pointer-events:none}
.cbar .in{max-width:612px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 16px 34px -14px rgba(22,34,43,.8);pointer-events:auto;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.cbar .tot{flex:1;min-width:0}
.cbar small{display:block;color:#9FB0B7;font-size:.76rem}
.cbar b{font-size:1.25rem;font-weight:800}
.cbar .btn{min-width:140px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;position:relative}
.bnav a svg{width:22px;height:22px}
.bnav a.on{color:var(--accent)}
.bnav a.on::before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.bnav .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:.66rem;display:flex;align-items:center;justify-content:center}

/* done / tracking / orders */
.done{text-align:center}
.done .big{width:72px;height:72px;margin:4px auto 6px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;font-size:2.2rem;animation:pop .4s}
.done h2{margin:6px 0 4px;font-size:1.45rem}
.done p{color:var(--muted);margin:0 0 14px}
.code{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;letter-spacing:.08em;margin-bottom:12px}
.paidf{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;margin-bottom:12px}
.paidf label{grid-column:1/-1;font-size:.86rem;font-weight:700}
.paidok{padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:.9rem;margin-bottom:12px}
.tl{list-style:none;margin:0 0 16px;padding:0;text-align:left}
.tl li{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:0 0 18px}
.tl li::before{content:"";position:absolute;left:16px;top:32px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl .dot{width:34px;height:34px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800;color:var(--muted);position:relative;z-index:1}
.tl li.ok .dot{background:var(--ok-bar);border-color:var(--ok-bar);color:#fff}
.tl li.ok::before{background:var(--ok-bar)}
.tl li.now .dot{background:#fff;border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px rgba(22,34,43,.08)}
.tl li.bad .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tl b{display:block;padding-top:6px}
.tl small{color:var(--muted);font-size:.82rem}
.reason{padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid #F1C9CF;margin-bottom:14px}
.reason b{display:block;color:var(--accent-2)}
.reason small{color:var(--ink-2)}
.ohist{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ohist:first-of-type{border-top:none}
.ohist small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.sb{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.sb.new{background:var(--warn-soft);color:var(--warn)}.sb.done{background:var(--blue-soft);color:var(--blue)}.sb.dlv{background:var(--ok-soft);color:var(--ok)}.sb.rej,.sb.can{background:var(--accent-soft);color:var(--accent-2)}

/* account */
.acct{display:grid;gap:12px}
.idcard{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-radius:18px;background:linear-gradient(140deg,#16222B,#2B3D49);color:#fff}
.idcard::after{content:"💎";position:absolute;right:-6px;bottom:-14px;font-size:4.5rem;opacity:.08}
.idcard span{display:block;font-size:.76rem;color:#9FB0B7}
.idcard b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:.08em}
.idcard small{color:#B9C6CB;font-size:.8rem}
.idcard .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;position:relative;z-index:1}
.hint{margin:0;font-size:.84rem;color:var(--muted)}
.gbox{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line-2)}
.gbox b{display:block;font-size:.95rem}.gbox small{color:var(--muted);font-size:.8rem}
.gbox .g{width:22px;height:22px;border-radius:50%;background:#fff;color:#4285F4;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.stats span{font-size:.7rem;color:var(--muted)}
.stats b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.uids{display:flex;flex-wrap:wrap;gap:6px}.uids span{padding:5px 10px;border-radius:999px;background:var(--bg);font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums}

/* faq + misc */
.faq details{border-top:1px solid var(--line)}
.faq details:first-of-type{border-top:none}
.faq summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:800;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0;padding:0 16px 14px;color:var(--ink-2);font-size:.92rem}
.state{padding:40px 16px;text-align:center;color:var(--muted)}
.state b{color:var(--ink);display:block;font-size:1.05rem;margin-bottom:4px}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,#eef1f1 25%,#f7f9f9 50%,#eef1f1 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:.78rem;padding:4px 16px 120px}
.view{animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@media(max-width:380px){.steps div em{display:none}.steps div{justify-content:center}.proof b{font-size:1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

const cartDia=()=>cart.reduce((s,l)=>s+pk(l.id).diamonds*l.qty,0);

function bestMix(N){
  const list=P.packages.filter(p=>p.kind!=='member'&&p.diamonds>0); if(!list.length||!(N>0)||N>200000) return null;
  const dp=new Float64Array(N+1).fill(1e15), pick=new Int32Array(N+1).fill(-1); dp[0]=0;
  for(let a=1;a<=N;a++) for(let i=0;i<list.length;i++){ const v=dp[Math.max(0,a-list[i].diamonds)]+list[i].price; if(v<dp[a]-1e-9){ dp[a]=v; pick[a]=i; } }
  const m=new Map(); let a=N; while(a>0){ const i=pick[a]; m.set(i,(m.get(i)||0)+1); a=Math.max(0,a-list[i].diamonds); }
  return [...m.entries()].map(([i,q])=>({id:list[i].id, qty:q}));
}
const mixPrice=m=>m.reduce((s,l)=>s+pk(l.id).price*l.qty,0), mixDia=m=>m.reduce((s,l)=>s+pk(l.id).diamonds*l.qty,0);
// honest upsell: cheaper mix for the same diamonds, or a bigger pack with a better rate
function upsell(){
  if (!cart.length || cart.some(l=>pk(l.id).kind==='member')) return null;
  const D=cartDia(), cur=total(), m=bestMix(D);
  if (m && mixPrice(m)<cur-0.5 && mixDia(m)>=D) return {kind:'swap', mix:m, save:cur-mixPrice(m)};
  if (cart.length===1){ const p=pk(cart[0].id), q=cart[0].qty; const bigger=P.packages.filter(x=>x.kind!=='member'&&x.diamonds>p.diamonds*q&&x.price/x.diamonds<p.price/p.diamonds).sort((a,b)=>a.price-b.price)[0];
    if (bigger && bigger.price-p.price*q <= p.price*q*1.1) return {kind:'up', mix:[{id:bigger.id,qty:1}], extra:bigger.price-p.price*q, more:bigger.diamonds-p.diamonds*q}; }
  return null;
}

    if (!CU){ err(t('authFail')+' '+(AUTH_ERR||'')); return; }
    const items=cart.map(l=>{ const p=pk(l.id); return {pkId:p.id,name:p.name,diamonds:p.diamonds,kind:p.kind,qty:l.qty,price:p.price}; });
    const b=$('cbBtn'); b.disabled=true; b.textContent='…';
    try{
      const data={name:me.name, phone:me.phone, uid:me.uid, items, method, note:me.note||'', at:Date.now(), status:'new', total:total(), cid:CU.uid, ccode:CP?CP.code:''};
      const ref=await addDoc(collection(db,'orders'), data);
      store.set('dc-last-order', Date.now());
      last={id:ref.id, ...data}; MY.unshift(last); me.note=''; step=4; buzz(); renderShop(); scrollTo({top:0,behavior:'smooth'});
      if (CP) saveProfile({name:me.name, phone:me.phone, ffUids:[me.uid, ...(CP.ffUids||[]).filter(u=>u!==me.uid)].slice(0,5)});
    }catch(e){ console.error(e); err(t('sendFail')); }
    b.disabled=false; b.textContent=t('send');
  }
});

/* =========================================================
   ORDERS LIST + LIVE TRACKING
   ========================================================= */
function viewOrders(){
  $('cbar').hidden=true;
  const sb=o=>{ const k=stOf(o); return `<span class="sb ${k}">${t('st_'+k)}</span>`; };
  $('app').innerHTML=`<div class="view"><div class="card"><div class="card-h"><h2>${t('ordersT')}</h2>${MY.length?`<span class="hint">${MY.length}</span>`:''}</div>
    ${!myLoaded&&!AUTH_ERR?'<div class="card-b"><div class="skel" style="height:70px"></div></div>':MY.length?MY.map(o=>`<a class="ohist" href="?o=${encodeURIComponent(o.id)}"><div><b>#${esc(code(o.id))} ${sb(o)}</b><small>${esc((o.items||[]).map(i=>i.qty+' × '+(i.kind==='member'?i.name:nf(i.diamonds)+' 💎')).join(', '))}</small><small>UID ${esc(o.uid)} · ${esc(ago(o.at))}</small></div><b class="num">${rs(o.total||0)}</b></a>`).join('')
      :`<div class="state"><div style="font-size:2.4rem">🛒</div><b>${t('noOrders')}</b>${t('noOrdersP')}<p><a class="btn accent" href="#">${t('startOrder')}</a></p></div>`}
  </div></div>`;
}
function viewTrack(id){
  $('cbar').hidden=true; if (unTrack) unTrack();
  $('app').innerHTML='<div class="card"><div class="state"><span class="spin"></span></div></div>';
  unTrack=onSnapshot(doc(db,'orders',id), s=>{
    if (!s.exists()){ $('app').innerHTML=`<div class="card"><div class="state"><b>${t('notFound')}</b><p><a class="btn" href="${location.pathname}">${t('toShop')}</a></p></div></div>`; return; }
    const o={id, ...s.data()}, k=stOf(o), w=P&&waNum(P.shop.wa), mine=CU&&o.cid===CU.uid;
    const i=MY.findIndex(x=>x.id===id); if(i>=0) MY[i]=o; badges();
    document.title=(k==='dlv'?'✅ ':k==='rej'||k==='can'?'✕ ':'⏳ ')+'#'+code(id);
    const li=(cls,icon,title,sub)=>`<li class="${cls}"><span class="dot">${icon}</span><div><b>${title}</b><small>${sub}</small></div></li>`;
    const rsn=(t('reasons')[o.reason]||t('reasons').other);
    const steps= k==='rej' ? li('ok','✓',t('st1'),esc(ago(o.at)))+li('bad','✕',t('rej'),esc(rsn[0]))
      : k==='can' ? li('ok','✓',t('st1'),esc(ago(o.at)))+li('bad','✕',t('canT'),o.cancelledAt?esc(ago(o.cancelledAt)):'')
      : li('ok','✓',t('st1'),esc(ago(o.at)))+li(k==='new'?'now':'ok',k==='new'?'2':'✓',t('st2'),k==='new'?(o.paidAt?t('paidOk'):t('st2w')):(o.doneAt?esc(ago(o.doneAt)):''))+li(k==='dlv'?'ok':k==='done'?'now':'',k==='dlv'?'✓':'3',t('st3'),k==='dlv'&&o.deliveredAt?esc(ago(o.deliveredAt)):t('st3w'));
    const canReorder=P&&P.packages.length&&(o.items||[]).some(x=>P.packages.some(p=>p.id===x.pkId));
    $('app').innerHTML=`<div class="view"><div class="card"><div class="card-h"><h2>${t('trackT')}</h2><span class="code" style="margin:0;padding:5px 12px;font-size:.82rem">#${esc(code(id))}</span></div><div class="card-b">
      ${['new','done'].includes(k)?`<p class="hint" style="margin:-4px 0 12px"><i class="live" style="display:inline-block;margin-right:6px"></i>${t('liveUpd')}</p>`:''}
      <ol class="tl">${steps}</ol>
      ${k==='rej'?`<div class="reason"><b>${esc(rsn[0])}</b><small>${esc(rsn[1])}</small></div>`:''}
      ${mine&&k==='new'?paidForm(o):''}
      <div class="sum">${(o.items||[]).map(x=>`<div><span>${x.qty} × ${esc(x.kind==='member'?x.name:nf(x.diamonds)+' 💎')}</span><b class="num">${rs(x.price*x.qty)}</b></div>`).join('')}<div class="t"><b>${t('total')}</b><b class="num">${rs(o.total||0)}</b></div></div>
      <dl class="kv"><dt>UID</dt><dd>${esc(o.uid)}</dd><dt>${t('name')}</dt><dd>${esc(o.name)}</dd><dt>${t('payBy')}</dt><dd>${esc(o.method||'')}</dd></dl>
      <div class="btns">
        ${canReorder&&['dlv','rej','can'].includes(k)?`<button class="btn accent block" type="button" id="reorder">↻ ${t('another')}</button>`:''}
        ${w?`<a class="btn wa block" href="https://wa.me/${w}?text=${encodeURIComponent('#'+code(id)+' ')}" target="_blank" rel="noopener">${t('msgShop')}</a>`:''}
        ${mine&&k==='new'?`<button class="btn ghost block" type="button" id="cancelBtn">${t('cancel')}</button>`:''}
        <a class="btn block" href="#orders">${t('ordersT')}</a>
      </div></div></div></div>`;
    const ro=$('reorder'); if(ro) ro.onclick=()=>{ cart=(o.items||[]).filter(x=>P.packages.some(p=>p.id===x.pkId)).map(x=>({id:x.pkId,qty:x.qty})); step=1; nav('shop'); };
    const cb=$('cancelBtn'); if(cb) cb.onclick=async()=>{ if(!confirm(t('cancelQ'))) return; try{ await setDoc(doc(db,'orders',id),{status:'cancelled',cancelledAt:Date.now()},{merge:true}); toast(t('cancelled')); }catch(e){ console.warn(e); toast(t('sendFail')); } };
  }, e=>{ console.warn(e); $('app').innerHTML=`<div class="card"><div class="state"><b>${t('notFound')}</b></div></div>`; });
}
document.addEventListener('click', async e=>{
  const pb=e.target.closest('[data-paid]'); if(!pb) return;
  const id=pb.dataset.paid, ref=($('paidRef').value||'').trim().slice(0,40);
  pb.disabled=true;
  try{ await setDoc(doc(db,'orders',id),{paidAt:Date.now(), paidRef:ref},{merge:true}); const o=MY.find(x=>x.id===id); if(o){ o.paidAt=Date.now(); o.paidRef=ref; } if(last&&last.id===id){ last.paidAt=Date.now(); last.paidRef=ref; if(step===4) renderShop(); } toast(t('paidOk')); }
  catch(err){ console.warn(err); toast(t('sendFail')); pb.disabled=false; }
});

/* =========================================================
   ACCOUNT
   ========================================================= */
const mkCode=()=>{ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s='C-'; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; };
async function loadProfile(){
  const ref=doc(db,'customers',CU.uid); let s=null; PROFILE_ERR=null;
  try{ s=await getDoc(ref); }catch(e){ console.warn(e); PROFILE_ERR=e.code||'error'; }
  if (s&&s.exists()) CP=s.data();
  else { CP={code:mkCode(), name:me.name||'', phone:me.phone||'', ffUids:me.uid?[me.uid]:[], createdAt:Date.now(), updatedAt:Date.now(), email:CU.email||''}; if(!PROFILE_ERR){ try{ await setDoc(ref,CP); }catch(e){ console.warn(e); PROFILE_ERR=e.code||'error'; } } }
  if (!me.name&&CP.name) me.name=CP.name; if (!me.phone&&CP.phone) me.phone=CP.phone; if (!me.uid&&(CP.ffUids||[])[0]) me.uid=CP.ffUids[0];
}
async function saveProfile(patch){ CP={...CP, ...patch, updatedAt:Date.now(), email:(CU&&CU.email)||''}; try{ await setDoc(doc(db,'customers',CU.uid),CP); return true; }catch(e){ console.warn(e); return false; } }
async function loadMine(){
  if (!CU) return; try{ const s=await getDocs(query(collection(db,'orders'), where('cid','==',CU.uid))); MY=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at); }catch(e){ console.warn(e); }
  myLoaded=true; badges();
}
async function googleSave(){
  const prov=new GoogleAuthProvider();
  try{
    if (CU&&CU.isAnonymous){ try{ await linkWithPopup(CU,prov); }catch(e){
        if ((e.code||'').includes('credential-already-in-use')){ await signInWithCredential(auth, GoogleAuthProvider.credentialFromError(e)); }
        else if (/popup-blocked|operation-not-supported/.test(e.code||'')){ await linkWithRedirect(CU,prov); return; } else throw e; } }
    else await signInWithPopup(auth,prov);
    CU=auth.currentUser; await loadProfile(); await saveProfile({}); await loadMine(); toast(t('saved')); viewAccount();
  }catch(e){ console.warn(e); toast(t('gFail')); }
}
function viewAccount(){
  $('cbar').hidden=true;
  if (AUTH_ERR){
    const off=/operation-not-allowed|admin-restricted/.test(AUTH_ERR), dom=/unauthorized-domain|requests-from-referer/.test(AUTH_ERR);
    $('app').innerHTML=`<div class="card"><div class="state"><div style="font-size:2rem">⚠️</div><b>${off?t('authOff'):t('authFail')}</b><p class="hint">${esc(off?'Firebase → Authentication → Sign-in method → enable Anonymous':dom?'Firebase → Authentication → Settings → Authorized domains → add '+location.hostname:'')}</p><p class="hint" style="font-size:.72rem">${esc(AUTH_ERR)}</p><p><button class="btn ink" type="button" id="retryAuth">↻</button></p></div></div>`;
    $('retryAuth').onclick=startAuth; return; }
  if (!CU||!CP){ $('app').innerHTML='<div class="skel"></div>'; return; }
  const acc=MY.filter(o=>o.status==='done'), spent=acc.reduce((s,o)=>s+(o.total||0),0), dia=acc.reduce((s,o)=>s+(o.items||[]).reduce((x,i)=>x+i.diamonds*i.qty,0),0);
  $('app').innerHTML=`<div class="view"><div class="card"><div class="card-b acct">
      <div class="idcard"><div><span>${t('youId')}</span><b>${esc(CP.code)}</b><small>${CU.isAnonymous?t('guest'):esc(t('googleAcc',CU.email||'Google'))}</small></div><button class="btn sm" type="button" data-copy="${esc(CP.code)}">${t('copy')}</button></div>
      ${PROFILE_ERR?`<div class="notice closed" style="margin:0"><span>⚠️</span><div><b>${L==='ne'?'खाता सेभ हुन सकेन':'Account can’t be saved yet'}</b><small>${esc(PROFILE_ERR)}</small></div></div>`:''}
      <p class="hint">${t('idHint')}</p>
      ${CU.isAnonymous?`<div class="gbox"><div><b>${t('saveG')}</b><small>${t('saveGP')}</small></div><button class="btn ink" type="button" id="gSave"><span class="g">G</span>Google</button></div>`:''}
      <div class="stats"><div><span>${t('statOrders')}</span><b>${MY.length}</b></div><div><span>${t('statSpent')}</span><b>${rs(spent)}</b></div><div><span>${t('statDia')}</span><b>${nf(dia)}</b></div><div><span>${t('statWait')}</span><b>${active()}</b></div></div>
    </div></div>
    ${P?loyaltyNote():''}
    <div class="card"><div class="card-h"><h2>${t('profile')}</h2></div><div class="card-b">
      <label class="field"><span class="lab">${t('name')}</span><input type="text" id="pName" maxlength="60" value="${esc(CP.name||'')}"/></label>
      <label class="field"><span class="lab">${t('wa')}</span><input type="tel" id="pPhone" maxlength="15" value="${esc(CP.phone||'')}"/></label>
      ${(CP.ffUids||[]).length?`<div class="field"><span class="lab">${t('ffUids')}</span><div class="uids">${CP.ffUids.map(u=>`<span>${esc(u)}</span>`).join('')}</div></div>`:''}
      <div class="btns"><button class="btn ink" type="button" id="pSave">${t('saveBtn')}</button>${!CU.isAnonymous?`<button class="btn ghost" type="button" id="outBtn">${t('signOut')}</button>`:''}</div>
    </div></div></div>`;
  const g=$('gSave'); if(g) g.onclick=googleSave;
  const out=$('outBtn'); if(out) out.onclick=async()=>{ await signOut(auth); };
  $('pSave').onclick=async()=>{ const ok=await saveProfile({name:$('pName').value.trim().slice(0,60), phone:$('pPhone').value.trim().slice(0,15)}); me.name=CP.name; me.phone=CP.phone; toast(ok?t('saved'):t('sendFail')); };
}

/* =========================================================
   EVENTS + ROUTING
   ========================================================= */
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-add]'); if(a){ const l=cart.find(x=>x.id===a.dataset.add); if(l) l.qty++; else cart.push({id:a.dataset.add,qty:1}); calcMsg=''; buzz(); renderShop(); return; }
  const q=e.target.closest('[data-q]'); if(q){ const i=+q.closest('[data-i]').dataset.i; cart[i].qty+=+q.dataset.q; if(cart[i].qty<1) cart.splice(i,1); if(!cart.length) step=1; renderShop(); return; }
  const m=e.target.closest('[data-m]'); if(m){ method=m.dataset.m; document.querySelectorAll('#method button').forEach(b=>b.setAttribute('aria-pressed',String(b===m))); return; }
  const s=e.target.closest('[data-step]'); if(s){ if(step===2) readDetails(); step=+s.dataset.step; renderShop(); scrollTo({top:0,behavior:'smooth'}); return; }
  const uu=e.target.closest('[data-useuid]'); if(uu){ $('uid').value=uu.dataset.useuid; return; }
  const c=e.target.closest('[data-copy]'); if(c){ copy(c.dataset.copy); }
});
function nav(v){ history.pushState(null,'',location.pathname+(v==='orders'?'#orders':v==='account'?'#account':'')); route(); scrollTo({top:0}); }
document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); nav(a.dataset.nav); }));
addEventListener('popstate', route);
addEventListener('hashchange', ()=>{ if(new URLSearchParams(location.search).get('o')) history.replaceState(null,'',location.pathname+location.hash); route(); scrollTo({top:0}); });
function route(){
  const id=new URLSearchParams(location.search).get('o'), h=location.hash;
  view = id?'track': h==='#orders'?'orders': h==='#account'?'account':'shop';
  if (view!=='track'&&unTrack){ unTrack(); unTrack=null; document.title=(P&&P.shop.name?P.shop.name+' · ':'')+'Free Fire Diamonds'; }
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===(view==='track'?'orders':view)));
  $('hero').hidden = view!=='shop' || step>1;
  if (!P && view!=='track') return;
  if (view==='track') viewTrack(id); else if (view==='orders') viewOrders(); else if (view==='account') viewAccount(); else renderShop();
}

/* =========================================================
   START
   ========================================================= */
async function startAuth(){
  AUTH_ERR=null; if(view==='account') viewAccount();
  clearTimeout(authTimer); authTimer=setTimeout(()=>{ if(!CU){ AUTH_ERR='timeout: sign-in did not respond'; if(view==='account'||view==='orders') route(); } },12000);
  if (auth.currentUser){ CU=auth.currentUser; return; }
  try{ await signInAnonymously(auth); }catch(e){ console.warn(e); CU=null; AUTH_ERR=(e.code||'')+' '+(e.message||''); clearTimeout(authTimer); myLoaded=true; if(view!=='shop') route(); }
}
onAuthStateChanged(auth, async u=>{
  if (!u){ startAuth(); return; }
  clearTimeout(authTimer); AUTH_ERR=null; CU=u;
  await loadProfile(); await loadMine(); if (view!=='shop' || step===1) route();
});
getRedirectResult(auth).catch(()=>{});
(async()=>{
  paintShell();
  try{
    const s=await getDoc(doc(db,'public','prices'));
    if (!s.exists()||!(s.data().packages||[]).length) throw new Error('empty');
    P=s.data(); P.shop=P.shop||{};
    if (P.shop.name){ $('shopName').textContent=P.shop.name; document.title=P.shop.name+' · Free Fire Diamonds'; }
    paintShell(); route();
  }catch(e){
    console.error(e);
    if (new URLSearchParams(location.search).get('o')){ P={shop:{},packages:[]}; route(); return; }
    $('app').innerHTML=`<div class="card"><div class="state"><b>${t('loadFail')}</b>${t('loadFailP')}</div></div>`;
  }
})();
</script>
